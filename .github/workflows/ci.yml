name: CI

on:
    push:
    pull_request:

permissions:
    contents: read

# Un push nuevo sobre la misma rama cancela la corrida anterior.
concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: true

jobs:
    quality:
        name: Lint, formato y tests
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v4.2.2
            - name: Set up Node.js
              uses: actions/setup-node@v4.4.0
              with:
                  node-version: 22
                  cache: npm
            - name: Install dependencies
              run: npm ci
            - name: Lint
              run: npm run lint:check
            - name: Formato
              run: npm run format:check
            - name: Tests
              run: npm test

    contract:
        name: Contrato OpenAPI
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v4.2.2
            - name: Set up Node.js
              uses: actions/setup-node@v4.4.0
              with:
                  node-version: 22
                  cache: npm
            - name: Install dependencies
              run: npm ci
            # Falla si hay rutas montadas sin documentar o documentadas sin montar.
            - name: Validar OpenAPI contra el router
              run: npm run validate:openapi

    security:
        name: Dependencias y secretos
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v4.2.2
              with:
                  # El scan recorre los archivos trackeados de la revisión actual.
                  fetch-depth: 1
            - name: Set up Node.js
              uses: actions/setup-node@v4.4.0
              with:
                  node-version: 22
                  cache: npm
            - name: Install dependencies
              run: npm ci
            # Falla ante cualquier high/critical que no esté en security/audit-allowlist.json.
            - name: Audit de dependencias
              run: npm run audit:deps
            - name: Scan de secretos
              run: npm run scan:secrets
