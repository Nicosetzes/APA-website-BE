                        application/json:
                            schema:
                                $ref: "#/components/schemas/ErrorResponse"

    /api/recaps:
        post:
            tags: [Recaps]
            summary: Guarda el recap diario generado por n8n
            description: >-
                Lo llama el workflow de n8n, no el FE. Hay un recap por `date`:
                reenviar el de un día ya guardado lo reemplaza (200) en lugar
                de duplicarlo (201 al crearlo).
            security:
                - recapSecret: []
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: "#/components/schemas/RecapRequest"
            responses:
                "200":
                    description: Ya existía un recap de esa fecha y fue reemplazado
                "201":
                    description: Recap creado
                "400":
                    $ref: "#/components/responses/BadRequest"
                "401":
                    description: Secreto ausente o inválido (INVALID_RECAP_SECRET)
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/ErrorResponse"
                "429":
                    description: Demasiados secretos inválidos desde la misma IP (TOO_MANY_RECAP_ATTEMPTS)
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/ErrorResponse"
                "503":
                    description: El secreto no está configurado en el servidor (RECAP_SECRET_NOT_CONFIGURED)
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/ErrorResponse"

    /api/ratings:
        get:
            tags: [Ratings]
            summary: Ranking Elo actual de los jugadores
            description: >-
                Elo calculado sobre todo el historial de partidos jugados y
                válidos, en orden cronológico. No se guarda: se recalcula en
                cada consulta, así que editar un resultado viejo se refleja
                enseguida. Todos los jugadores arrancan en `initialRating`.
                Un empate, también el definido por penales, vale 0,5. El
                rating es provisorio (`provisional`) hasta `provisionalMatches`
                partidos. Desde la versión 2.0 también considera la fuerza de
                los equipos usados: el puntaje esperado de cada partido suma
                `teamStrengthWeight` por el "overall" de Sofifa del equipo
                (de la edición del juego con que se jugó el torneo) cuando hay
                dato de ambos equipos; si falta alguno, el partido se calcula
                como en la 1.0. El rating mostrado no incluye ese término.
            responses:
                "200":
                    description: Ranking, del mejor al peor
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    success:
                                        type: boolean
                                    parameters:
                                        $ref: "#/components/schemas/RatingParameters"
                                    data:
                                        type: array
                                        items:
                                            $ref: "#/components/schemas/RatingRow"
    /api/ratings/period:
        get:
            tags: [Ratings]
            summary: Cómo cambió el ranking Elo en un período (power ranking)
            description: >-
                Compara el ranking al inicio de `dateFrom` con el del cierre de
                `dateTo`, ambos días calendario de Argentina e inclusivos. Pensado
                para el power ranking semanal: con `dateFrom` = lunes y `dateTo`
                = domingo da la variación de la semana. `previousPosition` y
                `previousRating` son `null` para jugadores que todavía no tenían
                partidos al inicio; su `ratingChange` se mide contra el rating
                inicial. `highlights.biggestUpset` es el partido con ganador que
                el Elo menos esperaba (`null` si no hubo sorpresas); su
                `winnerExpectedScore` ("esperaba") incluye el término de
                fuerza de equipo (`teamStrengthWeight`) cuando hay dato de
                ambos equipos.
            parameters:
                - in: query
                  name: dateFrom
                  required: true
                  schema:
                      type: string
                      pattern: "^\\d{4}-\\d{2}-\\d{2}$"
                      example: "2026-10-05"
                - in: query
                  name: dateTo
                  required: true
                  schema:
                      type: string
                      pattern: "^\\d{4}-\\d{2}-\\d{2}$"
                      example: "2026-10-11"
            responses:
                "200":
                    description: Ranking al cierre del período con sus variaciones
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    success:
                                        type: boolean
                                    dateFrom:
                                        type: string
                                    dateTo:
                                        type: string
                                    parameters:
                                        $ref: "#/components/schemas/RatingParameters"
                                    data:
                                        type: object
                                        properties:
                                            matchesInPeriod:
                                                type: integer
                                            players:
                                                type: array
                                                items:
                                                    $ref: "#/components/schemas/RatingPeriodRow"
                                            highlights:
                                                type: object
                                                properties:
                                                    biggestUpset:
                                                        type: object
                                                        nullable: true
                                                        additionalProperties: true
                "400":
                    $ref: "#/components/responses/BadRequest"
    /api/recaps/context:
        get:
            tags: [Recaps]
            summary: Contexto de formato y estado de los torneos que jugaron un día
            description: >-
                Pensado para el workflow de n8n: por cada torneo con partidos
                jugados en `date` (día calendario de Argentina) devuelve las
                reglas del formato (texto fijo), la tabla de posiciones, el
                play-in y el cuadro de playoff. La tabla es la del cierre de
                `date`: ignora lo jugado después y cada fila trae
                `previousPosition`, la posición al inicio del día (`null` si
                en ese grupo todavía no se había jugado). El play-in y el
                cuadro muestran siempre el estado actual (`asOf`), por lo que
                el endpoint es confiable para recaps del mismo día. No incluye
                los partidos de ese día (se piden con `/api/matches`) ni
                calcula consecuencias (quién clasificó o necesita ganar), salvo
                los flags `eliminated`, `directlyQualified` y `playinQualified`
                que ya trae la tabla. Sin partidos ese día devuelve `data: []`.
            parameters:
                - in: query
                  name: date
                  required: true
                  schema:
                      type: string
                      pattern: "^\\d{4}-\\d{2}-\\d{2}$"
                      example: "2026-10-11"
            responses:
                "200":
                    description: Contexto por torneo
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    success:
                                        type: boolean
                                    date:
                                        type: string
                                    data:
                                        type: array
                                        items:
                                            $ref: "#/components/schemas/RecapTournamentContext"
                "400":
                    $ref: "#/components/responses/BadRequest"
    /api/recaps/dates:
        get:
            tags: [Recaps]
            summary: Lista las fechas que tienen recap, de la más nueva a la más vieja
            description: >-
                Sólo las fechas (sin texto), para armar un selector en el FE y
                pedir cada recap con `/api/recaps/{date}`.
            responses:
                "200":
                    description: Fechas disponibles (lista vacía si no hay recaps)
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    success:
                                        type: boolean
                                    data:
                                        type: array
                                        items:
                                            type: string
                                            pattern: "^\\d{4}-\\d{2}-\\d{2}$"
                                        example: ["2026-10-12", "2026-10-11"]
    /api/recaps/latest:
        get:
            tags: [Recaps]
            summary: Devuelve el recap más reciente
            responses:
                "200":
                    description: Recap del día más reciente
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/RecapResponse"
                "404":
                    $ref: "#/components/responses/NotFound"
    /api/recaps/{date}:
        get:
            tags: [Recaps]
            summary: Devuelve el recap de un día
            parameters:
                - in: path
                  name: date
                  required: true
                  description: Día del recap (YYYY-MM-DD)
                  schema:
                      type: string
                      pattern: "^\\d{4}-\\d{2}-\\d{2}$"
                      example: "2026-10-11"
            responses:
                "200":
                    description: Recap de ese día
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/RecapResponse"
                "400":
                    $ref: "#/components/responses/BadRequest"
                "404":
                    $ref: "#/components/responses/NotFound"

components:
    securitySchemes:
        bearerAuth:
            type: http
            scheme: bearer
            bearerFormat: JWT
        recapSecret:
            type: apiKey
            in: header
            name: X-Recap-Secret
    parameters:
        TournamentId:
            in: path
            name: tournament
            required: true
            schema:
                $ref: "#/components/schemas/MongoId"
        MatchId:
            in: path
            name: match
            required: true
            schema:
                $ref: "#/components/schemas/MongoId"
    responses:
        BadRequest:
            description: Solicitud inválida
            content:
                application/json:
                    schema:
                        $ref: "#/components/schemas/ErrorResponse"
        InvalidSession:
            description: Sesión ausente o inválida
            content:
                application/json:
                    schema:
                        $ref: "#/components/schemas/ErrorResponse"
        Forbidden:
            description: Usuario autenticado sin permisos sobre el recurso
            content:
                application/json:
                    schema:
                        $ref: "#/components/schemas/ErrorResponse"
        NotFound:
            description: Recurso inexistente
            content:
                application/json:
                    schema:
                        $ref: "#/components/schemas/ErrorResponse"
        PlayoffResultBadRequest:
            description: >-
                VALIDATION_ERROR, INVALID_MATCH_RESULT, PENALTIES_NOT_ALLOWED,
                PENALTIES_REQUIRED, PENALTIES_INCOMPLETE, PENALTIES_TIED,
                PENALTIES_WITH_REGULATION_WINNER o EXPECTED_SERIES_REVISION_REQUIRED.
            content:
                application/json:
                    schema:
                        $ref: "#/components/schemas/ErrorResponse"
        PlayoffMutationConflict:
            description: >-
                REGULAR_PHASE_CLOSED, PLAYOFF_LATER_LEG_PLAYED,
                PLAYOFF_SERIES_ADVANCED, PLAYOFF_STATE_CONFLICT,
                PLAYOFF_DUPLICATE_LEG, PLAYOFF_SLOT_CONFLICT,
                PLAYOFF_COMPETITOR_CONFLICT, PLAYOFF_SERIES_NOT_READY o
                PLAYOFF_CONFIGURATION_ERROR. PLAYOFF_SERIES_ADVANCED también
                protege de forma fail-closed una final ya cerrada; no se ejecutan cascadas.
            content:
                application/json:
                    schema:
                        $ref: "#/components/schemas/ErrorResponse"
        RegularPhaseClosed:
            description: REGULAR_PHASE_CLOSED. El partido es de fase regular y la eliminatoria ya fue generada (el play-in de su zona en league_playin_playoff, el playoff en el resto de los formatos)
            content:
                application/json:
                    schema:
                        $ref: "#/components/schemas/ErrorResponse"
    schemas:
        RatingParameters:
            type: object
            description: Parámetros con los que se calculó el Elo
            properties:
                version:
                    type: string
                    description: Versión del APA Rating (ver docs/APA-RATING.md)
                    example: "2.0"
                initialRating:
                    type: number
                kFactor:
                    type: number
                marginWeight:
                    type: number
                teamStrengthWeight:
                    type: number
                    description: >-
                        Puntos Elo que suma el puntaje esperado por cada punto
                        de "overall" de Sofifa del equipo usado. Con 25, una
                        brecha de 10 de overall pesa 250 puntos Elo. 0 es el
                        rating 1.0 (sin fuerza de equipos).
                    example: 25
                provisionalMatches:
                    type: integer
        RatingPlayer:
            type: object
            properties:
                id:
                    type: string
                name:
                    type: string
        RatingRow:
            type: object
            properties:
                position:
                    type: integer
                    minimum: 1
                player:
                    $ref: "#/components/schemas/RatingPlayer"
                rating:
                    type: number
                matches:
                    type: integer
                wins:
                    type: integer
                draws:
                    type: integer
                losses:
                    type: integer
                peak:
                    type: number
                    description: Máximo rating alcanzado
                provisional:
                    type: boolean
                lastPlayedAt:
                    type: string
                    format: date-time
                    nullable: true
                lastChange:
                    type: number
                    nullable: true
                    description: Variación de rating en su último partido
        RatingPeriodRow:
            type: object
            properties:
                position:
                    type: integer
                previousPosition:
                    type: integer
                    nullable: true
                positionChange:
                    type: integer
                    nullable: true
                    description: Lugares que subió (positivo) o bajó (negativo)
                player:
                    $ref: "#/components/schemas/RatingPlayer"
                rating:
                    type: number
                previousRating:
                    type: number
                    nullable: true
                ratingChange:
                    type: number
                matchesInPeriod:
                    type: integer
                record:
                    type: object
                    properties:
                        wins:
                            type: integer
                        draws:
                            type: integer
                        losses:
                            type: integer
                provisional:
                    type: boolean
        RecapTournamentContext:
            type: object
            properties:
                tournamentId:
                    type: string
                tournament:
                    type: string
                format:
                    type: string
                    enum:
                        [
                            champions_league,
                            league,
                            league_playin_playoff,
                            playoff,
                            super_cup,
                            world_cup,
                            world_cup_2026,
                        ]
                ongoing:
                    type: boolean
                    description: Valor actual, no el de `date`
                asOf:
                    type: object
                    description: Momento al que corresponde cada parte de la respuesta
                    properties:
                        standings:
                            type: string
                            description: Fecha de cierre de la tabla (la de la consulta)
                        playin:
                            type: string
                            enum: [current]
                        bracket:
                            type: string
                            enum: [current]
                rules:
                    type: object
                    description: Reglas fijas del formato, para citar y no inferir
                    properties:
                        stages:
                            type: array
                            items:
                                type: string
                                enum: [regular, playin, playoff]
                        description:
                            type: string
                            nullable: true
                        tableTiebreak:
                            type: string
                            nullable: true
                        qualification:
                            type: object
                            nullable: true
                            additionalProperties: true
                        knockout:
                            type: string
                            nullable: true
                standings:
                    type: array
                    description: Una entrada por grupo (`group` null si no hay grupos); vacío en formatos sin fase regular
                    items:
                        type: object
                        properties:
                            group:
                                type: string
                                nullable: true
                            teams:
                                type: array
                                items:
                                    type: object
                                    description: Fila de la tabla al cierre de `date`, con `position` y `previousPosition` (base 1; la de inicio del día, o null si nadie había jugado en el grupo); sin `streak`
                                    additionalProperties: true
                playin:
                    type: array
                    items:
                        $ref: "#/components/schemas/RecapContextMatch"
                bracket:
                    type: array
                    description: Cruces de playoff con al menos un equipo definido, por `playoffId`
                    items:
                        type: object
                        properties:
                            playoffId:
                                type: integer
                            round:
                                type: string
                                nullable: true
                                enum:
                                    [
                                        round_of_32,
                                        round_of_16,
                                        quarterfinal,
                                        semifinal,
                                        final,
                                    ]
                            series:
                                type: object
                                nullable: true
                                description: Estado de la serie (sólo formato `playoff`)
                                additionalProperties: true
                            matches:
                                type: array
                                items:
                                    $ref: "#/components/schemas/RecapContextMatch"
        RecapContextMatch:
            type: object
            properties:
                playoffId:
                    type: integer
                    nullable: true
                leg:
                    type: integer
                    nullable: true
                played:
                    type: boolean
                playedAt:
                    type: string
                    format: date-time
                    nullable: true
                playerP1:
                    type: object
                    nullable: true
                    additionalProperties: true
                teamP1:
                    type: object
                    nullable: true
                    additionalProperties: true
                seedP1:
                    type: string
                    nullable: true
                scoreP1:
                    type: integer
                    nullable: true
                playerP2:
                    type: object
                    nullable: true
                    additionalProperties: true
                teamP2:
                    type: object
                    nullable: true
                    additionalProperties: true
                seedP2:
                    type: string
                    nullable: true
                scoreP2:
                    type: integer
                    nullable: true
                outcome:
                    type: object
                    nullable: true
                    additionalProperties: true
        RecapResponse:
            type: object
            required: [success, data]
            properties:
                success:
                    type: boolean
                data:
                    type: object
                    description: El recap guardado (mismos campos que el POST) más `updatedAt`
                    additionalProperties: true
        RecapRequest:
            type: object
            required: [date, matchCount, recap, tournaments, createdAt]
            additionalProperties: false
            properties:
                date:
                    type: string
                    pattern: "^\\d{4}-\\d{2}-\\d{2}$"
                    example: "2026-10-11"
                matchCount:
                    type: integer
                    minimum: 0
                recap:
                    type: string
                    description: Texto completo del recap, ya dividido por torneo
                tournaments:
                    type: array
                    maxItems: 100
                    items:
                        type: object
                        required:
                            [
                                tournamentId,
                                tournament,
                                matchCount,
                                matchesByStage,
                            ]
                        additionalProperties: false
                        properties:
                            tournamentId:
                                type: string
                            tournament:
                                type: string
                            matchCount:
                                type: integer
                                minimum: 0
                            matchesByStage:
                                type: object
                                description: Partidos del torneo por etapa; siempre vienen las tres claves
                                required: [playoff, playin, regular]
                                additionalProperties: false
                                properties:
                                    playoff:
                                        type: integer
                                        minimum: 0
                                    playin:
                                        type: integer
                                        minimum: 0
                                    regular:
                                        type: integer
                                        minimum: 0
                                example: { playoff: 2, playin: 0, regular: 0 }
                createdAt:
                    type: string
                    format: date-time
        MongoId:
            type: string
            pattern: "^[a-fA-F0-9]{24}$"
        User:
            type: object
            required: [id, nickname, role]
            properties:
                id:
                    $ref: "#/components/schemas/MongoId"
                nickname:
                    type: string
                role:
                    type: string
                    enum: [user, superadmin]
        EntityReference:
            type: object
            required: [id, name]
            properties:
                id:
                    oneOf:
                        - type: string
                        - type: integer
                name:
                    type: string
            additionalProperties: true
        LoginRequest:
            type: object
            required: [email, password]
            additionalProperties: false
            properties:
                email:
                    type: string
                    format: email
                password:
                    type: string
                    minLength: 6
                    maxLength: 1024
        LoginResponse:
            type: object
            required: [auth, token, user, message]
            properties:
                auth:
                    type: boolean
                    example: true
                token:
                    type: string
                user:
                    $ref: "#/components/schemas/User"
                message:
                    type: string
        CurrentUserResponse:
            type: object
            required: [auth, user]
            properties:
                auth:
                    type: boolean
                    example: true
                user:
                    $ref: "#/components/schemas/User"
        CreateTournamentRequest:
            type: object
            required: [format, name, players, teams]
            additionalProperties: false
            properties:
                cloudinary_id:
                    type: string
                    nullable: true
                format:
                    type: string
                    enum:
                        [
                            champions_league,
                            league,
                            league_playin_playoff,
                            playoff,
                            super_cup,
                            world_cup,
                            world_cup_2026,
                        ]
                playoffMode:
                    type: string
                    enum: [single, two_legged]
                    description: Sólo se acepta para format playoff; si falta se persiste single
                name:
                    type: string
                    minLength: 1
                    maxLength: 100
                players:
                    type: array
                    minItems: 1
                    items:
                        $ref: "#/components/schemas/EntityReference"
                teams:
                    type: array
                    minItems: 1
                    items:
                        type: object
                        required: [team, player]
                        properties:
                            team:
                                type: object
                                required: [id, name]
                                additionalProperties: true
                                description: >-
                                    El `id` del equipo se guarda como número;
                                    un string numérico ("10") se convierte.
                                properties:
                                    id:
                                        type: integer
                                        minimum: 0
                                    name:
                                        type: string
                                        minLength: 1
                                        maxLength: 255
                            player:
                                $ref: "#/components/schemas/EntityReference"
                            group:
                                type: string
                                pattern: "^[A-L]$"
                            playoff_id:
                                type: integer
                                minimum: 1
                        additionalProperties: true
        Tournament:
            type: object
            required: [_id, name, format, players, teams]
            properties:
                _id:
                    $ref: "#/components/schemas/MongoId"
                name:
                    type: string
                format:
                    type: string
                playoffMode:
                    type: string
                    enum: [single, two_legged]
                    description: Ausente en torneos históricos; sólo aplica a playoff
                schemaVersion:
                    type: integer
                    enum: [1]
                    description: Presente sólo en documentos creados bajo el contrato versionado actual
                players:
                    type: array
                    items:
                        $ref: "#/components/schemas/EntityReference"
                teams:
                    type: array
                    items:
                        type: object
                        additionalProperties: true
                startedAt:
                    type: string
                    format: date-time
                    description: >-
                        Fecha del primer partido jugado del torneo (se fija al
                        cargar el primer resultado y se recalcula si se borra).
                        Ausente = torneo no empezado.
                startedAtPrecision:
                    $ref: "#/components/schemas/PlayedAtPrecision"
                closedAt:
                    type: string
                    format: date-time
                    description: >-
                        Cierre del torneo: fecha del partido que decidió la final
                        o del último partido de la liga. Presente en todo
                        torneo cerrado.
                closedAtPrecision:
                    $ref: "#/components/schemas/PlayedAtPrecision"
            additionalProperties: true
        PlayoffSeriesAggregate:
            type: object
            required: [teamId, score]
            properties:
                teamId:
                    type: integer
                score:
                    type: integer
                    minimum: 0
        PlayoffSeriesMetadata:
            type: object
            required: [key, revision, status, aggregate, winnerTeamId]
            properties:
                key:
                    type: string
                revision:
                    type: integer
                    minimum: 0
                status:
                    type: string
                    enum:
                        [
                            awaiting_leg1,
                            awaiting_leg2,
                            awaiting_tiebreak,
                            decided,
                        ]
                aggregate:
                    type: array
                    items:
                        $ref: "#/components/schemas/PlayoffSeriesAggregate"
                winnerTeamId:
                    type: integer
                    nullable: true
        PlayoffMutationMetadata:
            type: object
            required: [canEditResult, canDeleteResult, reason]
            properties:
                canEditResult:
                    type: boolean
                canDeleteResult:
                    type: boolean
                reason:
                    type: string
                    nullable: true
                    enum:
                        [later_leg_played, series_advanced, configuration_error]
        PlayoffSeriesError:
            type: object
            required: [code, message]
            properties:
                code:
                    type: string
                    enum:
                        [PLAYOFF_CONFIGURATION_ERROR, PLAYOFF_SERIES_NOT_READY]
                message:
                    type: string
        PlayedAt:
            type: string
            format: date-time
            description: >-
                Fecha en la que se jugó el partido. Se fija al cargar el
                primer resultado, no cambia al editarlo y se borra al quitar el
                resultado. Todo partido jugado la tiene; un no jugado no.
        PlayedAtPrecision:
            type: string
            enum: [exact, day, month, year, approx]
            description: >-
                Qué parte de `playedAt` es conocida. Presente siempre que hay
                fecha.
        PlayoffMatch:
            type: object
            properties:
                leg:
                    type: integer
                    enum: [1, 2, 3]
                seriesRevision:
                    type: integer
                    minimum: 0
                playedAt:
                    $ref: "#/components/schemas/PlayedAt"
                playedAtPrecision:
                    $ref: "#/components/schemas/PlayedAtPrecision"
                series:
                    $ref: "#/components/schemas/PlayoffSeriesMetadata"
                mutation:
                    $ref: "#/components/schemas/PlayoffMutationMetadata"
                seriesError:
                    $ref: "#/components/schemas/PlayoffSeriesError"
                prediction:
                    allOf:
                        - $ref: "#/components/schemas/MatchPrediction"
                    nullable: true
                    description: >-
                        "Prob. de éxito" de cada lado según el APA Rating 2.0.
                        Solo la devuelve `GET .../playoff/matches` (no las
                        respuestas de carga de resultado). Es `null` en
                        `champions_league` y en playoffs `two_legged`, en
                        partidos simulados o W.O. (`valid: false`), con un lado
                        vacío, con el mismo jugador en ambos lados o si el
                        cálculo falla.
            additionalProperties: true
        MatchPrediction:
            type: object
            required: [p1, p2, basis, teamAdjusted, provisional, ratingVersion]
            properties:
                p1:
                    type: number
                    minimum: 0
                    maximum: 1
                    description: Probabilidad de avanzar de P1, con 3 decimales.
                p2:
                    type: number
                    minimum: 0
                    maximum: 1
                    description: Probabilidad de avanzar de P2. `p1 + p2 = 1`.
                basis:
                    type: string
                    enum: [pre_match, current]
                    description: >-
                        `pre_match`: partido jugado, usa el evento del motor
                        (odds previas al partido). `current`: partido por
                        jugar, usa los ratings actuales y puede moverse.
                teamAdjusted:
                    type: boolean
                    description: >-
                        `false` si no se aplicó el término de equipo y el valor
                        se calculó como en la 1.0.
                provisional:
                    type: boolean
                    description: >-
                        `true` si alguno de los dos jugadores tenía menos de
                        `provisionalMatches` partidos.
                ratingVersion:
                    type: string
                    example: "2.0"
        PlayinMatch:
            type: object
            properties:
                playedAt:
                    $ref: "#/components/schemas/PlayedAt"
                playedAtPrecision:
                    $ref: "#/components/schemas/PlayedAtPrecision"
                prediction:
                    allOf:
                        - $ref: "#/components/schemas/MatchPrediction"
                    nullable: true
                    description: >-
                        "Prob. de éxito" de cada lado según el APA Rating 2.0.
                        Es `null` en partidos simulados o W.O. (`valid: false`),
                        con un lado vacío, con el mismo jugador en ambos lados,
                        si el torneo es `champions_league` o un playoff
                        `two_legged`, o si el cálculo falla.
            additionalProperties: true
        UpdateMatchRequest:
            type: object
            required: [playerP1, teamP1, scoreP1, playerP2, teamP2, scoreP2]
            additionalProperties: false
            properties:
                playerP1:
                    $ref: "#/components/schemas/EntityReference"
                teamP1:
                    $ref: "#/components/schemas/EntityReference"
                scoreP1:
                    type: integer
                    minimum: 0
                    maximum: 24
                seedP1:
                    oneOf:
                        - type: string
                        - type: integer
                penaltyScoreP1:
                    type: integer
                    minimum: 0
                    maximum: 24
                playerP2:
                    $ref: "#/components/schemas/EntityReference"
                teamP2:
                    $ref: "#/components/schemas/EntityReference"
                scoreP2:
                    type: integer
                    minimum: 0
                    maximum: 24
                seedP2:
                    oneOf:
                        - type: string
                        - type: integer
                penaltyScoreP2:
                    type: integer
                    minimum: 0
                    maximum: 24
                expectedSeriesRevision:
                    type: integer
                    minimum: 0
                    description: Revisión optimista de una serie administrada
                valid:
                    type: boolean
                isThisTheFinal:
                    type: boolean
                    deprecated: true
                    description: >-
                        Ignorado. El backend deriva si el partido es la final a
                        partir del formato del torneo y del `playoff_id`
                        persistido. Se sigue aceptando por compatibilidad y se
                        retirará del contrato.
        ErrorDetail:
            type: object
            required: [source, path, code]
            properties:
                source:
                    type: string
                    enum: [params, query, body]
                path:
                    type: string
                code:
                    type: string
                    description: Tipo de error de Joi o regla de negocio (`match.*`)
                message:
                    type: string
                    description: Explicación en castellano para mostrar al usuario; nunca incluye el valor recibido
        ErrorResponse:
            type: object
            required: [error]
            properties:
                error:
                    type: object
                    required: [code, message, details, requestId]
                    properties:
                        code:
                            type: string
                        message:
                            type: string
                        details:
                            type: array
                            items:
                                $ref: "#/components/schemas/ErrorDetail"
                        requestId:
                            type: string
                            description: Identificador de correlación también presente en X-Request-Id
        Liveness:
            type: object
            required: [status]
            properties:
                status:
                    type: string
                    enum: [ok]
        Readiness:
            type: object
            required: [status, checks]
            properties:
                status:
                    type: string
                    enum: [ready, not_ready]
                checks:
                    type: object
                    required: [mongodb]
                    properties:
                        mongodb:
                            type: string
                            enum:
                                [
                                    disconnected,
                                    connected,
                                    connecting,
                                    disconnecting,
                                    unknown,
                                ]
