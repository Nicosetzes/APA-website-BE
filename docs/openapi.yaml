openapi: 3.0.3
info:
    title: APA Website API
    version: 1.1.0
    description: |
        Contrato inicial de los endpoints principales consumidos por APA-website-FE.
        Es incremental y todavía no documenta todas las consultas estadísticas y de resumen.
servers:
    - url: http://localhost:5000
      description: Desarrollo local
    - url: https://apa-website-be.vercel.app
      description: Producción

tags:
    - name: Health
    - name: Users
    - name: Tournaments
    - name: Matches
    - name: Statistics
    - name: Edits
    - name: Recaps
    - name: Ratings
    - name: Assistant

paths:
    /health/live:
        get:
            tags: [Health]
            summary: Comprueba que el proceso HTTP está activo
            responses:
                "200":
                    description: Proceso activo
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/Liveness"
    /health/ready:
        get:
            tags: [Health]
            summary: Comprueba disponibilidad de MongoDB
            responses:
                "200":
                    description: API lista
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/Readiness"
                "503":
                    description: MongoDB no disponible
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/Readiness"
    /api/users/login:
        post:
            tags: [Users]
            summary: Inicia una sesión
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: "#/components/schemas/LoginRequest"
            responses:
                "200":
                    description: Sesión iniciada
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/LoginResponse"
                "400":
                    $ref: "#/components/responses/BadRequest"
                "401":
                    description: |
                        Credenciales incorrectas. La respuesta es idéntica para
                        email inexistente y contraseña equivocada.
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/ErrorResponse"
                "429":
                    description: Demasiados intentos fallidos desde la misma IP
                    headers:
                        Retry-After:
                            schema:
                                type: integer
                            description: Segundos hasta el próximo intento permitido
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/ErrorResponse"
    /api/users:
        get:
            tags: [Users]
            summary: Listado público de jugadores para selectores
            responses:
                "200":
                    description: Jugadores con id y nombre visible
                    content:
                        application/json:
                            schema:
                                type: array
                                items:
                                    type: object
                                    required: [id, name]
                                    properties:
                                        id:
                                            type: string
                                        name:
                                            type: string
                "400":
                    $ref: "#/components/responses/BadRequest"
                "500":
                    description: Error interno de persistencia
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/ErrorResponse"
    /api/users/me:
        get:
            tags: [Users]
            summary: Valida la sesión y devuelve identidad y rol vigentes
            security:
                - bearerAuth: []
            responses:
                "200":
                    description: Sesión válida
                    headers:
                        Cache-Control:
                            schema:
                                type: string
                            example: no-store
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/CurrentUserResponse"
                "401":
                    $ref: "#/components/responses/InvalidSession"
    /api/matches:
        get:
            tags: [Matches]
            summary: Lista partidos históricos con filtros y paginación
            parameters:
                - in: query
                  name: page
                  description: Número de página en base 1
                  schema:
                      type: integer
                      minimum: 1
                      maximum: 10000
                      default: 1
                - in: query
                  name: teamName
                  description: Coincidencia parcial sobre el nombre de cualquiera de los equipos
                  schema:
                      type: string
                      maxLength: 100
                - in: query
                  name: player1
                  description: ID de jugador, o "all"/"" para no filtrar
                  schema:
                      type: string
                - in: query
                  name: player2
                  description: Rival de player1; requiere player1 para tener efecto
                  schema:
                      type: string
                - in: query
                  name: tournamentId
                  description: ID de torneo, o "all"/"" para no filtrar
                  schema:
                      type: string
                - in: query
                  name: type
                  schema:
                      type: string
                      enum: [all, regular, knockout, playin, playoff]
                - in: query
                  name: playoffRound
                  description: Ronda de playoff, derivada del formato del torneo y del playoff_id; requiere type=playoff para tener efecto
                  schema:
                      type: string
                      enum:
                          [
                              all,
                              round_of_32,
                              round_of_16,
                              quarterfinal,
                              semifinal,
                              final,
                          ]
                - in: query
                  name: outcome
                  description: >-
                      Resultado desde la perspectiva de player1. `win` excluye
                      las tandas de penales; `winIncludingPenalties` es
                      cualquier partido que ganó player1, también por penales.
                  schema:
                      type: string
                      enum:
                          [
                              all,
                              win,
                              winIncludingPenalties,
                              draw,
                              loss,
                              penalties,
                          ]
                - in: query
                  name: goalDiffOp
                  schema:
                      type: string
                      enum: [gte, lte, eq]
                      default: gte
                - in: query
                  name: goalDiffVal
                  description: Diferencia absoluta entre scoreP1 y scoreP2 (los empates cuentan como 0)
                  schema:
                      type: integer
                      minimum: 0
                      maximum: 99
                - in: query
                  name: totalGoalsOp
                  schema:
                      type: string
                      enum: [gte, lte, eq]
                      default: gte
                - in: query
                  name: totalGoalsVal
                  description: Suma de scoreP1 y scoreP2
                  schema:
                      type: integer
                      minimum: 0
                      maximum: 48
                - in: query
                  name: player1GoalsOp
                  schema:
                      type: string
                      enum: [gte, lte, eq]
                      default: gte
                - in: query
                  name: player1GoalsVal
                  description: Goles de player1 en el partido; requiere player1 para tener efecto
                  schema:
                      type: integer
                      minimum: 0
                      maximum: 24
                - in: query
                  name: player1ConcededOp
                  schema:
                      type: string
                      enum: [gte, lte, eq]
                      default: gte
                - in: query
                  name: player1ConcededVal
                  description: Goles recibidos por player1, contra cualquier rival; requiere player1 para tener efecto
                  schema:
                      type: integer
                      minimum: 0
                      maximum: 24
                - in: query
                  name: player1Team
                  description: Coincidencia parcial sobre el equipo que usó player1; requiere player1 para tener efecto
                  schema:
                      type: string
                      maxLength: 100
                - in: query
                  name: opponentTeam
                  description: Coincidencia parcial sobre el equipo que enfrentó player1; requiere player1 para tener efecto
                  schema:
                      type: string
                      maxLength: 100
                - in: query
                  name: dateFrom
                  schema:
                      type: string
                      pattern: "^\\d{4}-\\d{2}-\\d{2}$"
                - in: query
                  name: dateTo
                  schema:
                      type: string
                      pattern: "^\\d{4}-\\d{2}-\\d{2}$"
                - in: query
                  name: played
                  description: Por defecto se excluyen los partidos no jugados
                  schema:
                      type: boolean
            responses:
                "200":
                    description: Página de partidos con totales
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    matches:
                                        type: array
                                        description: >-
                                            Ordenados por `playedAt` y `_id`
                                            desc (los no jugados, sin fecha,
                                            al final); en el historial de playoff de
                                            un torneo, por llave y pierna.
                                            `dateFrom`/`dateTo` filtran sobre
                                            la misma fecha.
                                        items:
                                            type: object
                                            properties:
                                                playedAt:
                                                    $ref: "#/components/schemas/PlayedAt"
                                                playedAtPrecision:
                                                    $ref: "#/components/schemas/PlayedAtPrecision"
                                                ratingChange:
                                                    type: object
                                                    nullable: true
                                                    description: >-
                                                        Puntos de rating (APA Rating 2.0) que
                                                        ganó o perdió cada jugador en este
                                                        partido, leídos de los ratings
                                                        persistidos. `p2` es siempre `-p1`
                                                        (`0` si no hubo variación). `null`
                                                        si el partido no tiene variación
                                                        (pendiente, inválido, simulado, W.O. o
                                                        mismo jugador en ambos lados), si lo
                                                        guardado no está al día o si falla la
                                                        lectura; en ese caso el resto de la
                                                        respuesta no cambia.
                                                    properties:
                                                        p1:
                                                            type: number
                                                            description: Puntos para el jugador 1 (2 decimales).
                                                        p2:
                                                            type: number
                                                            description: Puntos para el jugador 2 (2 decimales).
                                                        ratingVersion:
                                                            type: string
                                                            example: "2.0"
                                            additionalProperties: true
                                    totalMatches:
                                        type: integer
                                    totalPages:
                                        type: integer
                                    currentPage:
                                        type: integer
                                        minimum: 1
                                        description: >-
                                            Base 1, igual que el parámetro
                                            `page`: la primera página devuelve 1.
                "400":
                    $ref: "#/components/responses/BadRequest"
                "500":
                    description: Error interno de persistencia
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/ErrorResponse"
    /api/matches/teams:
        get:
            tags: [Matches]
            summary: Equipos usados en partidos, para sugerir en los buscadores
            description: >-
                Equipos de teamP1 y teamP2 en partidos válidos y jugados, uno
                por nombre y ordenados alfabéticamente. El id permite mostrar
                el escudo.
            responses:
                "200":
                    description: Lista de equipos
                    content:
                        application/json:
                            schema:
                                type: array
                                items:
                                    type: object
                                    required: [id, name]
                                    properties:
                                        id:
                                            nullable: true
                                            oneOf:
                                                - type: string
                                                - type: integer
                                        name:
                                            type: string
                "400":
                    $ref: "#/components/responses/BadRequest"
                "500":
                    description: Error interno de persistencia
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/ErrorResponse"
    /api/statistics/all-time/teams:
        get:
            tags: [Statistics]
            summary: Top 10 de equipos por puntos y por efectividad
            description: |
                `completeStatsByTotalPoints` agrupa por equipo.
                `completeStatsByEffectiveness` agrupa por jugador, equipo y
                torneo, y exige al menos 10 partidos. Las victorias por penales
                no cuentan como victoria.
            responses:
                "200":
                    description: Leaderboards históricos de equipos
                    content:
                        application/json:
                            schema:
                                type: object
                                required:
                                    - completeStatsByTotalPoints
                                    - completeStatsByEffectiveness
                                properties:
                                    completeStatsByTotalPoints:
                                        type: array
                                        items:
                                            type: object
                                            additionalProperties: true
                                    completeStatsByEffectiveness:
                                        type: array
                                        items:
                                            type: object
                                            additionalProperties: true
                "400":
                    $ref: "#/components/responses/BadRequest"
                "500":
                    description: Error interno de persistencia
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/ErrorResponse"
    /api/statistics/all-time/face-to-face:
        get:
            tags: [Statistics]
            summary: Historial de cruces entre cada par de jugadores
            description: |
                Una entrada por par de jugadores, con los totales espejados en
                `p1` y `p2`. `bestWin` es `null` cuando ese jugador no le ganó
                nunca al otro.
            responses:
                "200":
                    description: Historial por par
                    content:
                        application/json:
                            schema:
                                type: array
                                items:
                                    type: object
                                    required: [p1, p2]
                                    properties:
                                        p1:
                                            type: object
                                            additionalProperties: true
                                        p2:
                                            type: object
                                            additionalProperties: true
                "400":
                    $ref: "#/components/responses/BadRequest"
                "500":
                    description: Error interno de persistencia
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/ErrorResponse"
    /api/statistics:
        get:
            tags: [Statistics]
            summary: Agregados, leaderboards y records de jugadores
            description: |
                Sin `tournament` agrega todos los usuarios y partidos.
                Con `tournament` restringe a los jugadores inscriptos y a los
                partidos válidos jugados de ese torneo, y agrega `longest_streak`
                por jugador. El detalle interno de cada leaderboard todavía no
                está descripto campo por campo.

                Las rachas de `records` (`most_*_in_a_row`) y de `activeStreaks`
                comparten el shape `{ count, players }` (o `null` si nadie tiene
                racha). Cada poseedor trae `id`, `name`, `date` (igual a
                `endDate`, por compatibilidad), `datePrecision`, `isActive`,
                `startDate`, `startDatePrecision`, `endDate`,
                `endDatePrecision`, `startMatch`, `endMatch` y `breakMatch`.
                Las fechas salen de `playedAt` y son `null` en partidos no
                jugados. Cada `*Precision` (y `datePrecision` de los
                partidos) es `exact`, `day`, `month`, `year` o `approx`
                (`null` si no hay fecha). Los partidos de
                `highest_scoring_difference_match` y
                `highest_total_goals_match` y los `recent` de cada jugador
                también traen `date` + `datePrecision`.
                Una racha está activa si incluye el partido más reciente del
                jugador. `endMatch` es el último partido válido de la racha y
                `breakMatch` el partido que la cortó (`null` si está activa).
                Los partidos (`date`, `datePrecision`, `tournament`, `type`,
                `team`, `opponent`,
                `opponentTeam`, `goalsFor`, `goalsAgainst`, `result`,
                `penalties`) van en la perspectiva del poseedor; con una racha
                de un partido, `startMatch` y `endMatch` son el mismo.
                `penalties` es `null` si el partido no se definió por penales;
                si no, `{ won, goalsFor, goalsAgainst }` con los goles de la
                tanda (siempre numéricos).
                Entre empatados se ordena primero la activa y después por
                `startDate` ascendente (sin fecha al final). `activeStreaks`
                tiene, por tipo, la racha vigente más larga entre jugadores;
                es `null` si esa racha tiene menos de 2 partidos. En `records`
                se mantienen las rachas de 1 partido por compatibilidad.

                Después de las 8 rachas de partidos, `records` y
                `activeStreaks` traen, en este orden,
                `most_penalty_shootout_wins_in_a_row`,
                `most_knockout_wins_in_a_row`,
                `most_knockout_unbeaten_in_a_row`,
                `most_consecutive_semifinals`, `most_consecutive_finals` y
                `most_consecutive_titles`, con el mismo `{ count, players }`,
                el mismo orden de poseedores y el mismo mínimo de 2 en
                `activeStreaks`.

                Rachas mata-mata (`most_knockout_*`): sólo cuentan los
                partidos `playin` y `playoff`; los regulares no las extienden
                ni las cortan. Una tanda de penales es victoria para
                `outcome.playerThatWon` y derrota para el otro; una ida
                empatada sin penales es empate. Las rachas generales siguen
                tratando los penales como empate. El poseedor tiene el mismo
                shape que el de partidos y `result` es el resultado
                mata-mata. Está activa si incluye el último partido mata-mata
                del jugador; `breakMatch` es su siguiente partido mata-mata.

                Tandas ganadas seguidas
                (`most_penalty_shootout_wins_in_a_row`): sólo cuentan los
                partidos definidos por penales (`outcome.penalties: true`)
                con ganador registrado, de cualquier `type`; el resto no la
                extiende ni la corta. Ganar la tanda la extiende y perderla
                la corta. El poseedor tiene el mismo shape que el de partidos
                y `result` es el de la tanda (`W`/`L`). Está activa si incluye
                la última tanda del jugador; `breakMatch` es su siguiente
                tanda (la que perdió).

                Rachas por torneo (`most_consecutive_semifinals` = top 4,
                `most_consecutive_finals` = top 2, `most_consecutive_titles` =
                campeón): sólo cuenta el bracket de playoff; el play-in no es
                una fase. La fase alcanzada es la ronda más alta (por rango de
                `playoff_id` del formato) entre los partidos del jugador en el
                torneo, válidos o no, jugados o no: estar asignado a un slot
                es haber llegado a esa ronda. Campeón: el ganador de la única
                final jugada (penales incluidos, vía `playerThatWon`); si la
                final enfrenta dos equipos del mismo jugador, ese jugador.
                Sólo en torneos cerrados, sin final resuelta, se usa
                `tournament.outcome.champion`/`finalist`. Participó quien está
                en `tournament.players`, en un partido válido o asignado a un
                partido de playoff; un torneo sin participación no corta ni
                extiende, y participar sin llegar (aunque no haya
                clasificado) corta. Se saltean para todos los torneos
                `valid: false` y los que no tienen partidos de playoff. Un
                torneo cerrado (`ongoing: false`) cuenta siempre. Uno en
                curso cuenta sólo si el logro ya está asegurado (llegó a
                semis, está en la final, o ganó la final jugada) o si el
                fracaso ya es seguro (cuadro de semis completo, final asignada
                o final jugada sin el jugador); si no, se saltea. Orden: los
                en curso son los más nuevos (por último partido jugado), y
                los cerrados van por `closedAt`; desempate por `startedAt` y
                `_id`. Está activa si incluye el torneo contado más reciente
                del jugador.

                Poseedor de torneo: `id`, `name`, `date`, `datePrecision`,
                `isActive`, `startDate`, `startDatePrecision`, `endDate`,
                `endDatePrecision`, `startTournament`, `endTournament` y
                `breakTournament` (`null` si está activa). Cada resumen de
                torneo trae `id`, `name`, `phaseReached` (`regular`, `playin`,
                `round_of_32`, `round_of_16`, `quarterfinal`, `semifinal`,
                `final` = perdió la final, o `champion`), `ongoing`,
                `closedAt`, `closedAtPrecision`, `lastPlayedAt`,
                `lastPlayedAtPrecision` y, para `X` en `Playoff`,
                `Semifinal` y `Final`, `firstXPlayedAt`,
                `firstXPlayedAtPrecision`, `lastXPlayedAt` y
                `lastXPlayedAtPrecision`. Las fechas del poseedor salen de
                `closedAt` (o de `lastPlayedAt` si el torneo sigue en curso).
                `firstPlayoffPlayedAt`/`lastPlayoffPlayedAt` son el primer y
                el último partido `type: playoff` jugado y válido del jugador
                en ese torneo (los que lista `/api/matches`, por `playedAt`),
                o `null` si no jugó ninguno. Los de
                `Semifinal` y `Final` son lo mismo restringido a esa ronda
                (por rango de `playoff_id` del formato, como
                `/api/matches?playoffRound=`); las dos piernas de una llave de
                ida y vuelta cuentan.

                Con `tournament` las 5 claves van en `null`. Sin `tournament`,
                si falla la lectura de torneos, las 3 rachas por torneo se
                omiten de `records` y `activeStreaks`.
            parameters:
                - in: query
                  name: tournament
                  schema:
                      type: string
                      pattern: "^[a-f\\d]{24}$"
            responses:
                "200":
                    description: Estadísticas calculadas
                    content:
                        application/json:
                            schema:
                                type: object
                                required:
                                    - scope
                                    - players
                                    - decisiveMatchesStats
                                    - leaderboards
                                    - records
                                    - activeStreaks
                                properties:
                                    scope:
                                        type: object
                                        properties:
                                            tournament:
                                                type: string
                                                nullable: true
                                    players:
                                        type: array
                                        items:
                                            type: object
                                            additionalProperties: true
                                    decisiveMatchesStats:
                                        type: array
                                        items:
                                            type: object
                                            additionalProperties: true
                                    leaderboards:
                                        type: object
                                        additionalProperties: true
                                    records:
                                        type: object
                                        additionalProperties: true
                                    activeStreaks:
                                        type: object
                                        additionalProperties: true
                "400":
                    $ref: "#/components/responses/BadRequest"
                "404":
                    $ref: "#/components/responses/NotFound"
                "500":
                    description: Error interno de persistencia
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/ErrorResponse"
    /api/tournaments:
        get:
            tags: [Tournaments]
            summary: Lista torneos
            description: >-
                Ordenados por `startedAt` desc; un torneo sin `startedAt` (no
                empezado) cuenta como el más nuevo y va primero.
                `status=finalized` va del más viejo al más nuevo, con los no
                empezados al final. Desempate siempre por `_id` desc. Cada
                torneo trae `startedAt`, `closedAt` y sus precisiones (sin
                `createdAt` ni `updatedAt`).
            parameters:
                - in: query
                  name: status
                  schema:
                      type: string
                      enum: [active, finalized]
                - in: query
                  name: legacy
                  schema:
                      type: boolean
            responses:
                "200":
                    description: Lista de torneos
                    content:
                        application/json:
                            schema:
                                type: array
                                items:
                                    $ref: "#/components/schemas/Tournament"
                "400":
                    $ref: "#/components/responses/BadRequest"
                "500":
                    description: Error interno de persistencia
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/ErrorResponse"
        post:
            tags: [Tournaments]
            summary: Crea un torneo
            security:
                - bearerAuth: []
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: "#/components/schemas/CreateTournamentRequest"
            responses:
                "200":
                    description: Torneo creado
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/Tournament"
                "400":
                    $ref: "#/components/responses/BadRequest"
                "401":
                    $ref: "#/components/responses/InvalidSession"
    /api/tournaments/{tournament}:
        get:
            tags: [Tournaments]
            summary: Obtiene un torneo
            parameters:
                - $ref: "#/components/parameters/TournamentId"
            responses:
                "200":
                    description: Torneo
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/Tournament"
                "400":
                    $ref: "#/components/responses/BadRequest"
                "404":
                    $ref: "#/components/responses/NotFound"
                "500":
                    description: Error interno de persistencia
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/ErrorResponse"
    /api/tournaments/{tournament}/summary:
        get:
            tags: [Tournaments]
            summary: Obtiene resumen, recientes y estadísticas de participantes
            description: |
                `matches.recent` (hasta 6) va ordenado por `playedAt` y `_id`
                desc. Cada partido trae `playedAt` y `playedAtPrecision`.
            parameters:
                - $ref: "#/components/parameters/TournamentId"
            responses:
                "200":
                    description: Summary del torneo
                    content:
                        application/json:
                            schema:
                                type: object
                                additionalProperties: true
                "400":
                    $ref: "#/components/responses/BadRequest"
                "404":
                    $ref: "#/components/responses/NotFound"
                "500":
                    description: Error interno de persistencia
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/ErrorResponse"
    /api/tournaments/{tournament}/recap:
        get:
            tags: [Recaps]
            summary: Devuelve el recap de un torneo terminado
            description: >-
                Lo consume la vista del torneo en el FE. Público. `data.recap`
                es Markdown (sin título principal: el titular va en
                `data.headline`). 404 `TOURNAMENT_RECAP_NOT_FOUND` si el torneo
                no tiene recap (todavía, o nunca: los torneos legacy no tienen
                partidos).
            parameters:
                - $ref: "#/components/parameters/TournamentId"
            responses:
                "200":
                    description: Recap del torneo
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/TournamentRecapResponse"
                "400":
                    $ref: "#/components/responses/BadRequest"
                "404":
                    $ref: "#/components/responses/NotFound"
    /api/tournaments/{tournament}/fixture:
        get:
            tags: [Matches]
            summary: Obtiene el fixture de un torneo
            parameters:
                - $ref: "#/components/parameters/TournamentId"
                - in: query
                  name: page
                  description: Número de página en base 1
                  schema:
                      type: integer
                      minimum: 1
                      maximum: 10000
                      default: 1
                - in: query
                  name: team
                  description: Id del equipo; un string numérico se convierte.
                  schema:
                      type: integer
                      minimum: 0
                - in: query
                  name: group
                  schema:
                      type: string
                      pattern: "^[A-L]$"
                - in: query
                  name: players
                  description: >-
                      Uno o dos IDs únicos de jugadores, como parámetro repetido
                      (`?players=a&players=b`). Todavía se acepta el formato
                      deprecado de array serializado en JSON: un valor que
                      empieza con `[` se interpreta como ese formato, así que
                      un ID no puede empezar con `[`.
                  explode: true
                  style: form
                  schema:
                      type: array
                      minItems: 1
                      maxItems: 2
                      uniqueItems: true
                      items:
                          type: string
                          minLength: 1
                          maxLength: 100
            responses:
                "200":
                    description: Fixture y metadatos de paginación
                    content:
                        application/json:
                            schema:
                                type: object
                                additionalProperties: true
                                properties:
                                    currentPage:
                                        type: integer
                                        minimum: 1
                                        description: >-
                                            Base 1, igual que el parámetro
                                            `page`: la primera página devuelve 1.
                                    matches:
                                        type: array
                                        description: >-
                                            Partidos de la página. Cada uno
                                            incluye `prediction` (victoria /
                                            empate / derrota) o `null`.
                                        items:
                                            $ref: "#/components/schemas/FixtureMatch"
                "400":
                    $ref: "#/components/responses/BadRequest"
                "500":
                    description: Error interno de persistencia
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/ErrorResponse"
        post:
            tags: [Matches]
            summary: Genera el fixture
            security:
                - bearerAuth: []
            parameters:
                - $ref: "#/components/parameters/TournamentId"
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            required: [group]
                            additionalProperties: false
                            properties:
                                group:
                                    type: string
                                    nullable: true
                                    pattern: "^[A-L]$"
            responses:
                "200":
                    description: Fixture generado
                "400":
                    $ref: "#/components/responses/BadRequest"
                "401":
                    $ref: "#/components/responses/InvalidSession"
                "403":
                    $ref: "#/components/responses/Forbidden"
                "404":
                    $ref: "#/components/responses/NotFound"
                "422":
                    description: Asignaciones inválidas o generación imposible
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/ErrorResponse"
                "500":
                    description: Error interno de persistencia
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/ErrorResponse"
    /api/tournaments/images:
        get:
            tags: [Tournaments]
            summary: Imágenes de torneos disponibles en Cloudinary
            responses:
                "200":
                    description: Listado de imágenes
                    content:
                        application/json:
                            schema:
                                type: object
                                required: [success, data]
                                properties:
                                    success:
                                        type: boolean
                                    total:
                                        type: integer
                                    data:
                                        type: array
                                        items:
                                            type: object
                                            properties:
                                                cloudinary_id:
                                                    type: string
                                                url:
                                                    type: string
                                                format:
                                                    type: string
                                                width:
                                                    type: integer
                                                height:
                                                    type: integer
                "400":
                    $ref: "#/components/responses/BadRequest"
                "502":
                    description: El proveedor de imágenes falló; el detalle no se expone
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/ErrorResponse"
    /api/tournaments/{tournament}/complete:
        put:
            tags: [Tournaments]
            summary: Cierra un torneo de formato liga y fija su outcome
            description: |
                Calcula campeón y finalista desde los partidos jugados y marca el
                torneo como finalizado. Rechaza formatos distintos de `league`,
                torneos ya cerrados y torneos sin outcome determinable.
            security:
                - bearerAuth: []
            parameters:
                - $ref: "#/components/parameters/TournamentId"
            responses:
                "200":
                    description: Torneo cerrado
                    content:
                        application/json:
                            schema:
                                type: object
                                required: [message, outcome]
                                properties:
                                    message:
                                        type: string
                                    outcome:
                                        type: object
                                        properties:
                                            champion:
                                                type: object
                                                additionalProperties: true
                                            finalist:
                                                type: object
                                                additionalProperties: true
                "400":
                    $ref: "#/components/responses/BadRequest"
                "401":
                    $ref: "#/components/responses/InvalidSession"
                "403":
                    $ref: "#/components/responses/Forbidden"
                "404":
                    $ref: "#/components/responses/NotFound"
                "409":
                    description: El torneo ya está finalizado
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/ErrorResponse"
                "422":
                    description: Formato no soportado u outcome no determinable
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/ErrorResponse"
                "500":
                    description: Error interno de persistencia
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/ErrorResponse"
    /api/tournaments/{tournament}/calculator:
        get:
            tags: [Tournaments]
            summary: Partidos restantes de los equipos elegidos y tabla del torneo
            parameters:
                - $ref: "#/components/parameters/TournamentId"
                - in: query
                  name: teams
                  required: true
                  description: >-
                      De 1 a 40 IDs de equipo (enteros, sin repetidos), como
                      parámetro repetido (`?teams=5&teams=7`); los strings
                      numéricos se convierten. Todavía se acepta el formato
                      deprecado de array serializado en JSON: un valor que
                      empieza con `[` se interpreta como ese formato.
                  explode: true
                  style: form
                  schema:
                      type: array
                      minItems: 1
                      maxItems: 40
                      uniqueItems: true
                      items:
                          type: integer
                          minimum: 0
            responses:
                "200":
                    description: Datos para la calculadora
                    content:
                        application/json:
                            schema:
                                type: object
                                required: [teams, standings]
                                properties:
                                    teams:
                                        type: array
                                        items:
                                            type: object
                                            additionalProperties: true
                                    standings:
                                        type: array
                                        items:
                                            type: object
                                            additionalProperties: true
                "400":
                    $ref: "#/components/responses/BadRequest"
                "500":
                    description: Error interno de persistencia
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/ErrorResponse"
    /api/tournaments/{tournament}/players/info:
        get:
            tags: [Tournaments]
            summary: Estadísticas de un jugador del torneo, o de todos
            description: |
                Con `player=<id>` devuelve un objeto con `player`, `teams`,
                `stats`, `bestTeam` y `worstTeam`. Sin `player`, o con
                `player=all`, devuelve `{ players: [...] }` con una entrada por
                jugador inscripto, incluidos los que no jugaron. `matches=false`
                omite el listado de partidos.
            parameters:
                - $ref: "#/components/parameters/TournamentId"
                - in: query
                  name: player
                  description: ID del jugador, o "all" para todos
                  schema:
                      type: string
                      maxLength: 100
                - in: query
                  name: matches
                  description: Acepta true/false, 1/0, yes/no, on/off
                  schema:
                      type: boolean
                      default: true
            responses:
                "200":
                    description: Estadísticas del jugador o de todos
                    content:
                        application/json:
                            schema:
                                type: object
                                additionalProperties: true
                "400":
                    $ref: "#/components/responses/BadRequest"
                "404":
                    $ref: "#/components/responses/NotFound"
                "500":
                    description: Error interno de persistencia
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/ErrorResponse"
    /api/tournaments/{tournament}/standings/table:
        get:
            tags: [Tournaments]
            summary: Tabla de posiciones del torneo
            description: |
                Devuelve una entrada por grupo. Si el torneo tiene grupos y no se
                envía `group`, devuelve todos; si no tiene grupos, devuelve una
                sola entrada con `group` ausente. En formato `league` agrega
                `eliminated`, y en `league_playin_playoff` además
                `directlyQualified` y `playinQualified`. Cada entrada de
                `streak` trae `playedAt` (ISO) y `datePrecision` (`exact`,
                `day`, `month`, `year` o `approx`).
            parameters:
                - $ref: "#/components/parameters/TournamentId"
                - in: query
                  name: group
                  schema:
                      type: string
                      pattern: "^[A-L]$"
            responses:
                "200":
                    description: Posiciones calculadas
                    content:
                        application/json:
                            schema:
                                type: object
                                required: [id, name, standings]
                                properties:
                                    id:
                                        type: string
                                    name:
                                        type: string
                                    standings:
                                        type: array
                                        items:
                                            type: object
                                            properties:
                                                group:
                                                    type: string
                                                    nullable: true
                                                teams:
                                                    type: array
                                                    items:
                                                        type: object
                                                        additionalProperties: true
                "400":
                    $ref: "#/components/responses/BadRequest"
                "404":
                    $ref: "#/components/responses/NotFound"
                "500":
                    description: Error interno de persistencia
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/ErrorResponse"
    /api/tournaments/{tournament}/matches/update-game/{match}:
        put:
            tags: [Matches]
            summary: Carga o modifica el resultado de un partido
            description: |
                En partidos de playoff y play-in avanza el cuadro en la misma transacción. En series administradas,
                una corrección se rechaza si existe una pierna posterior jugada o si la serie/final ya avanzó;
                esta política fail-closed evita cascadas y requiere intervención administrativa para corregir una final cerrada.
            security:
                - bearerAuth: []
            parameters:
                - $ref: "#/components/parameters/TournamentId"
                - $ref: "#/components/parameters/MatchId"
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: "#/components/schemas/UpdateMatchRequest"
            responses:
                "200":
                    description: Partido actualizado; las series administradas incluyen metadata derivada
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/PlayoffMatch"
                "400":
                    $ref: "#/components/responses/PlayoffResultBadRequest"
                "403":
                    $ref: "#/components/responses/Forbidden"
                "404":
                    $ref: "#/components/responses/NotFound"
                "409":
                    $ref: "#/components/responses/PlayoffMutationConflict"
    /api/tournaments/{tournament}/matches/delete-game/{match}:
        put:
            tags: [Matches]
            summary: Quita lógicamente el resultado de un partido
            security:
                - bearerAuth: []
            parameters:
                - $ref: "#/components/parameters/TournamentId"
                - $ref: "#/components/parameters/MatchId"
            requestBody:
                required: false
                content:
                    application/json:
                        schema:
                            type: object
                            properties:
                                expectedSeriesRevision:
                                    type: integer
                                    minimum: 0
                                    description: Obligatorio para series administradas
                            additionalProperties: false
            responses:
                "200":
                    description: Resultado quitado; las series administradas incluyen metadata derivada
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/PlayoffMatch"
                "400":
                    $ref: "#/components/responses/PlayoffResultBadRequest"
                "403":
                    $ref: "#/components/responses/Forbidden"
                "404":
                    $ref: "#/components/responses/NotFound"
                "409":
                    $ref: "#/components/responses/PlayoffMutationConflict"
    /api/tournaments/{tournament}/playoffs/preview:
        get:
            tags: [Tournaments]
            summary: Previsualización de cruces y tabla de mejores terceros
            description: |
                Disponible sólo para los formatos con bracket de fase de grupos,
                hoy `super_cup` y `world_cup_2026`. Para cualquier otro formato
                responde `422`.
            parameters:
                - $ref: "#/components/parameters/TournamentId"
            responses:
                "200":
                    description: Cruces previstos y tabla de terceros
                    content:
                        application/json:
                            schema:
                                type: object
                                required: [bracketPreview, thirdsTable]
                                properties:
                                    bracketPreview:
                                        type: array
                                        items:
                                            type: object
                                            additionalProperties: true
                                    thirdsTable:
                                        type: array
                                        items:
                                            type: object
                                            additionalProperties: true
                "400":
                    $ref: "#/components/responses/BadRequest"
                "404":
                    $ref: "#/components/responses/NotFound"
                "422":
                    description: El formato no tiene previsualización de cruces
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/ErrorResponse"
                "500":
                    description: Error interno de persistencia
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/ErrorResponse"
    /api/tournaments/{tournament}/playoffs/table:
        get:
            tags: [Tournaments]
            summary: Tabla de clasificados al playoff
            description: |
                Sólo devuelve datos para el formato `league_playin_playoff`: los
                seis mejores de cada grupo y, detrás, los clasificados por
                play-in, primero los de la ronda inicial. Para cualquier otro
                formato devuelve `standings: []`.
            parameters:
                - $ref: "#/components/parameters/TournamentId"
            responses:
                "200":
                    description: Clasificados ordenados
                    content:
                        application/json:
                            schema:
                                type: object
                                required: [standings]
                                properties:
                                    standings:
                                        type: array
                                        items:
                                            type: object
                                            additionalProperties: true
                "400":
                    $ref: "#/components/responses/BadRequest"
                "404":
                    $ref: "#/components/responses/NotFound"
                "500":
                    description: Error interno de persistencia
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/ErrorResponse"
    /api/tournaments/{tournament}/playoff/matches:
        get:
            tags: [Matches]
            summary: Lista los partidos de playoff; un array vacío es válido
            description: >-
                Playoffs administrados agregan leg, series y mutation; legacy y
                Champions conservan su forma histórica. Todos incluyen
                `prediction` según el APA Rating 2.0: "Prob. de éxito" (`p1` /
                `p2`) en playoffs de partido único y victoria / empate /
                derrota (`kind: outcomes`) en `champions_league` y en las patas
                1 y 2 de un playoff `two_legged`. Es `null` si no se puede
                calcular o en la pata 3 de un `two_legged`.
            parameters:
                - $ref: "#/components/parameters/TournamentId"
            responses:
                "200":
                    description: Objeto con una entrada por partido físico
                    content:
                        application/json:
                            schema:
                                type: object
                                required: [matches]
                                properties:
                                    matches:
                                        type: array
                                        items:
                                            $ref: "#/components/schemas/PlayoffMatch"
                "400":
                    $ref: "#/components/responses/BadRequest"
                "404":
                    $ref: "#/components/responses/NotFound"
                "500":
                    description: Error interno de persistencia
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/ErrorResponse"
    /api/tournaments/{tournament}/playoff:
        post:
            tags: [Matches]
            summary: Genera el bracket inicial para formatos con fase previa
            security:
                - bearerAuth: []
            parameters:
                - $ref: "#/components/parameters/TournamentId"
            requestBody:
                required: false
                content:
                    application/json:
                        schema:
                            type: object
                            additionalProperties: false
            responses:
                "200":
                    description: Array de partidos creados
                "400":
                    $ref: "#/components/responses/BadRequest"
                "401":
                    $ref: "#/components/responses/InvalidSession"
                "403":
                    $ref: "#/components/responses/Forbidden"
                "404":
                    $ref: "#/components/responses/NotFound"
                "409":
                    description: El playoff ya existe o la fase previa no está lista
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/ErrorResponse"
                "422":
                    description: Formato, participantes o datos del torneo incompatibles
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/ErrorResponse"
                "500":
                    description: Error inesperado de generación o persistencia
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/ErrorResponse"
    /api/tournaments/{tournament}/playin/matches:
        get:
            tags: [Matches]
            summary: Lista los partidos de play-in; un array vacío es válido
            description: Cada partido incluye `prediction` ("Prob. de éxito" según el APA Rating 2.0), o `null` si no se puede calcular.
            parameters:
                - $ref: "#/components/parameters/TournamentId"
            responses:
                "200":
                    description: Objeto con array matches
                    content:
                        application/json:
                            schema:
                                type: object
                                required: [matches]
                                properties:
                                    matches:
                                        type: array
                                        items:
                                            $ref: "#/components/schemas/PlayinMatch"
                "400":
                    $ref: "#/components/responses/BadRequest"
                "404":
                    $ref: "#/components/responses/NotFound"
                "500":
                    description: Error interno de persistencia
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/ErrorResponse"
    /api/tournaments/{tournament}/playin:
        post:
            tags: [Matches]
            summary: Genera la primera ronda de play-in para un grupo
            security:
                - bearerAuth: []
            parameters:
                - $ref: "#/components/parameters/TournamentId"
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            required: [group]
                            additionalProperties: false
                            properties:
                                group:
                                    type: string
                                    enum: [A, B]
            responses:
                "200":
                    description: Array de partidos creados
                "400":
                    $ref: "#/components/responses/BadRequest"
                "401":
                    $ref: "#/components/responses/InvalidSession"
                "403":
                    $ref: "#/components/responses/Forbidden"
                "404":
                    $ref: "#/components/responses/NotFound"
                "409":
                    description: El play-in ya existe o su estado es conflictivo
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/ErrorResponse"
                "422":
                    description: Formato, participantes o datos persistidos inválidos
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/ErrorResponse"
    /api/edits:
        get:
            tags: [Edits]
            summary: Lista imágenes editadas
            security:
                - bearerAuth: []
            parameters:
                - in: query
                  name: page
                  schema:
                      type: integer
                      minimum: 1
                      maximum: 10000
                      default: 1
            responses:
                "200":
                    description: Página de edits
                "400":
                    $ref: "#/components/responses/BadRequest"
                "401":
                    $ref: "#/components/responses/InvalidSession"
                "500":
                    description: Error interno de persistencia
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/ErrorResponse"
        post:
            tags: [Edits]
            summary: Sube hasta diez imágenes
            security:
                - bearerAuth: []
            requestBody:
                required: true
                content:
                    multipart/form-data:
                        schema:
                            type: object
                            required: [image]
                            properties:
                                image:
                                    type: array
                                    minItems: 1
                                    maxItems: 10
                                    items:
                                        type: string
                                        format: binary
            responses:
                "200":
                    description: Imágenes subidas
                "400":
                    description: Cantidad o estructura de archivos inválida
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/ErrorResponse"
                "401":
                    $ref: "#/components/responses/InvalidSession"
                "413":
                    description: Algún archivo supera 3 MB
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/ErrorResponse"
                "415":
                    description: El formato no es JPG, PNG o WebP
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/ErrorResponse"
                "429":
                    description: Límite de solicitudes de upload alcanzado para el usuario
                    headers:
                        Retry-After:
                            schema:
                                type: integer
                            description: Segundos hasta el próximo upload permitido
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/ErrorResponse"
                "500":
                    description: Falló la persistencia; el código indica si la limpieza Cloudinary fue completa o parcial
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/ErrorResponse"
    /api/edits/{id}:
        delete:
            tags: [Edits]
            summary: Elimina un edit propio o, para superadmin, cualquier edit
            security:
                - bearerAuth: []
            parameters:
                - in: path
                  name: id
                  required: true
                  schema:
                      $ref: "#/components/schemas/MongoId"
            responses:
                "200":
                    description: Edit eliminado
                "400":
                    $ref: "#/components/responses/BadRequest"
                "401":
                    $ref: "#/components/responses/InvalidSession"
                "403":
                    $ref: "#/components/responses/Forbidden"
                "404":
                    $ref: "#/components/responses/NotFound"
                "500":
                    description: Error al eliminar la referencia Mongo
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/ErrorResponse"

    /api/recaps:
        post:
            tags: [Recaps]
            summary: Guarda el recap diario generado por n8n
            description: >-
                Lo llama el workflow de n8n, no el FE. Hay un recap por `date`:
                reenviar el de un día ya guardado lo reemplaza (200) en lugar
                de duplicarlo (201 al crearlo).
            security:
                - recapSecret: []
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: "#/components/schemas/RecapRequest"
            responses:
                "200":
                    description: Ya existía un recap de esa fecha y fue reemplazado
                "201":
                    description: Recap creado
                "400":
                    $ref: "#/components/responses/BadRequest"
                "401":
                    description: Secreto ausente o inválido (INVALID_RECAP_SECRET)
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/ErrorResponse"
                "429":
                    description: Demasiados secretos inválidos desde la misma IP (TOO_MANY_RECAP_ATTEMPTS)
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/ErrorResponse"
                "503":
                    description: El secreto no está configurado en el servidor (RECAP_SECRET_NOT_CONFIGURED)
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/ErrorResponse"

    /api/ratings:
        get:
            tags: [Ratings]
            summary: Ranking Elo actual de los jugadores
            description: >-
                Elo calculado sobre todo el historial de partidos jugados y
                válidos, en orden cronológico. No se guarda: se recalcula en
                cada consulta, así que editar un resultado viejo se refleja
                enseguida. Todos los jugadores arrancan en `initialRating`.
                Un empate, también el definido por penales, vale 0,5. El
                rating es provisorio (`provisional`) hasta `provisionalMatches`
                partidos. Desde la versión 2.0 también considera la fuerza de
                los equipos usados: el puntaje esperado de cada partido suma
                `teamStrengthWeight` por el "overall" de Sofifa del equipo
                (de la edición del juego con que se jugó el torneo) cuando hay
                dato de ambos equipos; si falta alguno, el partido se calcula
                como en la 1.0. El rating mostrado no incluye ese término.
            responses:
                "200":
                    description: Ranking, del mejor al peor
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    success:
                                        type: boolean
                                    parameters:
                                        $ref: "#/components/schemas/RatingParameters"
                                    data:
                                        type: array
                                        items:
                                            $ref: "#/components/schemas/RatingRow"
    /api/ratings/period:
        get:
            tags: [Ratings]
            summary: Cómo cambió el ranking Elo en un período (power ranking)
            description: >-
                Compara el ranking al inicio de `dateFrom` con el del cierre de
                `dateTo`, ambos días calendario de Argentina e inclusivos. Pensado
                para el power ranking semanal: con `dateFrom` = lunes y `dateTo`
                = domingo da la variación de la semana. `previousPosition` y
                `previousRating` son `null` para jugadores que todavía no tenían
                partidos al inicio; su `ratingChange` se mide contra el rating
                inicial. `highlights.biggestUpset` es el partido con ganador que
                el Elo menos esperaba (`null` si no hubo sorpresas); su
                `winnerExpectedScore` ("esperaba") incluye el término de
                fuerza de equipo (`teamStrengthWeight`) cuando hay dato de
                ambos equipos.
            parameters:
                - in: query
                  name: dateFrom
                  required: true
                  schema:
                      type: string
                      pattern: "^\\d{4}-\\d{2}-\\d{2}$"
                      example: "2026-10-05"
                - in: query
                  name: dateTo
                  required: true
                  schema:
                      type: string
                      pattern: "^\\d{4}-\\d{2}-\\d{2}$"
                      example: "2026-10-11"
            responses:
                "200":
                    description: Ranking al cierre del período con sus variaciones
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    success:
                                        type: boolean
                                    dateFrom:
                                        type: string
                                    dateTo:
                                        type: string
                                    parameters:
                                        $ref: "#/components/schemas/RatingParameters"
                                    data:
                                        type: object
                                        properties:
                                            matchesInPeriod:
                                                type: integer
                                            players:
                                                type: array
                                                items:
                                                    $ref: "#/components/schemas/RatingPeriodRow"
                                            highlights:
                                                type: object
                                                properties:
                                                    biggestUpset:
                                                        type: object
                                                        nullable: true
                                                        additionalProperties: true
                "400":
                    $ref: "#/components/responses/BadRequest"
    /api/recaps/context:
        get:
            tags: [Recaps]
            summary: Contexto de formato y estado de los torneos que jugaron un día
            description: >-
                Pensado para el workflow de n8n: por cada torneo con partidos
                jugados en `date` (día calendario de Argentina) devuelve las
                reglas del formato (texto fijo), la tabla de posiciones, el
                play-in y el cuadro de playoff. La tabla es la del cierre de
                `date`: ignora lo jugado después y cada fila trae
                `previousPosition`, la posición al inicio del día (`null` si
                en ese grupo todavía no se había jugado). El play-in y el
                cuadro muestran siempre el estado actual (`asOf`), por lo que
                el endpoint es confiable para recaps del mismo día. No incluye
                los resultados completos de ese día (se piden con
                `/api/matches`) ni calcula consecuencias (quién clasificó o
                necesita ganar), salvo los flags `eliminated`,
                `directlyQualified` y `playinQualified` que ya trae la tabla.
                Sí trae `matchInsights`: por cada partido rateado de ese día,
                las odds previas del Rating APA 2.0 y el overall de cada
                equipo, y tres niveles ya calculados (`favorite` con las
                etiquetas del asistente, `ratingEdge` y `overallGap`). El
                resto de los números son crudos: la etiqueta de sorpresa la
                pone quien consume. Cada cruce del cuadro trae `nextRound` y
                el torneo `playoffStartRound`, para decir a qué fase avanza
                un ganador. Sin partidos ese día devuelve `data: []`.
            parameters:
                - in: query
                  name: date
                  required: true
                  schema:
                      type: string
                      pattern: "^\\d{4}-\\d{2}-\\d{2}$"
                      example: "2026-10-11"
            responses:
                "200":
                    description: Contexto por torneo
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    success:
                                        type: boolean
                                    date:
                                        type: string
                                    data:
                                        type: array
                                        items:
                                            $ref: "#/components/schemas/RecapTournamentContext"
                "400":
                    $ref: "#/components/responses/BadRequest"
    /api/recaps/dates:
        get:
            tags: [Recaps]
            summary: Lista las fechas que tienen recap, de la más nueva a la más vieja
            description: >-
                Sólo las fechas (sin texto), para armar un selector en el FE y
                pedir cada recap con `/api/recaps/{date}`.
            responses:
                "200":
                    description: Fechas disponibles (lista vacía si no hay recaps)
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    success:
                                        type: boolean
                                    data:
                                        type: array
                                        items:
                                            type: string
                                            pattern: "^\\d{4}-\\d{2}-\\d{2}$"
                                        example: ["2026-10-12", "2026-10-11"]
    /api/recaps/latest:
        get:
            tags: [Recaps]
            summary: Devuelve el recap más reciente
            responses:
                "200":
                    description: Recap del día más reciente
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/RecapResponse"
                "404":
                    $ref: "#/components/responses/NotFound"
    /api/recaps/{date}:
        get:
            tags: [Recaps]
            summary: Devuelve el recap de un día
            parameters:
                - in: path
                  name: date
                  required: true
                  description: Día del recap (YYYY-MM-DD)
                  schema:
                      type: string
                      pattern: "^\\d{4}-\\d{2}-\\d{2}$"
                      example: "2026-10-11"
            responses:
                "200":
                    description: Recap de ese día
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/RecapResponse"
                "400":
                    $ref: "#/components/responses/BadRequest"
                "404":
                    $ref: "#/components/responses/NotFound"

    /api/assistant/pending-matches:
        get:
            tags: [Assistant]
            summary: Partidos pendientes de los torneos activos, para el agente del chat
            description: >-
                Lo llama el agente de n8n (solo lectura, mismo secreto que los
                recaps). Junta los partidos sin jugar de todos los torneos
                activos (`ongoing: true`, `valid != false`, el mismo criterio de
                `GET /api/tournaments?status=active`) o de uno solo.


                **Alcance (`scope`).** `involving` (por defecto) devuelve los
                partidos en los que participa al menos uno de los `players`
                ("mis pendientes", "los de Leo"); sin `players` devuelve los de
                todos. `among` devuelve solo los partidos entre los jugadores
                indicados, con los dos lados dentro del grupo ("somos tres,
                ¿qué podemos jugar hoy?") y exige `players`.


                **Jugable** significa sin jugar, válido y con los dos jugadores
                asignados. Los cruces de playoff con un solo lado asignado
                (rival todavía por definir) no son jugables: se cuentan en
                `awaitingOpponent` y se detallan hasta 5. Los cruces entre dos
                equipos del mismo jugador se resuelven por elección y no se
                juegan: no se cuentan y se informan en `excluded.sameOwnerTies`.


                **Tamaño acotado.** `totalPending`, `byStage` y `byTournament`
                siempre cuentan todos los pendientes. `matches` detalla como
                máximo `limit` (10 por defecto; un valor mayor a 20 se ajusta
                a 20). Si hay más, `truncated` es `true`, `remaining` dice
                cuántos faltan y `byTournament[].viewPaths` trae las rutas del
                sitio donde verlos completos.


                Orden: torneos del más nuevo al más viejo, luego fase regular,
                play-in y playoff. La fase regular sigue el orden de la vista de
                fixture del FE (zona y después `_id` descendente); play-in y
                playoff, por llave y pata. Un jugador inexistente no es error:
                queda en `filters.unknownPlayers` y se explica en `notes`. Un
                torneo cerrado responde vacío con `filters.tournament.active`
                en `false`; uno inexistente, 404.


                **Favorito (solo con `favorites=true`).** Con `favorites=true`
                cada partido de `matches` trae `favorite` (ver el esquema): el
                favorito del duelo con su etiqueta y su probabilidad de ganar
                o de avanzar. Sin el parámetro (o con `favorites=false`) no se
                consulta la predicción y los partidos no traen la clave
                `favorite`. Se calcula solo para los partidos detallados (hasta
                20), nunca para todos los pendientes. Costo, solo con
                `favorites=true`: 2 lecturas del read-model de ratings
                (jugadores y resumen de la fuente; los pendientes no tienen
                eventos), una sola aunque haya varios torneos. Si el
                read-model está apagado o desactualizado, cae a 1 lectura del
                historial liviano de partidos. Sin favoritos, la consulta se
                limita a una lectura de los torneos, una de los usuarios y una
                de los partidos pendientes, sin consultas por torneo. Es un
                adorno que nunca rechaza el pedido: si el cálculo falla, los
                partidos salen sin `favorite`.


                **Resumen (`summaryOnly=true`).** Responde solo el resumen, sin
                detalle de partidos: `totalPending`, `byStage`, `byTournament`
                (con `viewPaths`), `excluded` y `awaitingOpponent.count` son
                los reales. `matches` es `[]` y `returned` es 0;
                `awaitingOpponent.matches` es `[]`. `remaining` es igual a
                `totalPending` y `truncated` es `true` si hay pendientes (el
                detalle está cortado en 0), con una nota en `notes` que
                lo explica. El `limit` no se usa para el detalle, pero
                `filters.limit` informa el límite efectivo. Si llega junto con
                `favorites=true`, se ignora `favorites` (no hay partidos para
                calcular) y la respuesta es la misma que con `summaryOnly=true`
                solo.
            security:
                - recapSecret: []
            parameters:
                - in: query
                  name: players
                  required: false
                  description: >-
                      Ids de jugador. Repetible (`players=a&players=b`), hasta 6,
                      sin duplicados. Obligatorio con `scope=among`.
                  schema:
                      type: array
                      maxItems: 6
                      items:
                          type: string
                  style: form
                  explode: true
                - in: query
                  name: scope
                  required: false
                  schema:
                      type: string
                      enum: [involving, among]
                      default: involving
                - in: query
                  name: tournamentId
                  required: false
                  description: Limita la búsqueda a un torneo
                  schema:
                      $ref: "#/components/schemas/MongoId"
                - in: query
                  name: stage
                  required: false
                  schema:
                      type: string
                      enum: [regular, playin, playoff]
                - in: query
                  name: limit
                  required: false
                  description: Partidos detallados (máximo efectivo 20)
                  schema:
                      type: integer
                      minimum: 1
                      default: 10
                - in: query
                  name: favorites
                  required: false
                  description: >-
                      Con `true` cada partido detallado trae `favorite`. Con
                      `false` o sin el parámetro no se calcula ni aparece la
                      clave. Se ignora si `summaryOnly` es `true`.
                  schema:
                      type: boolean
                      default: false
                - in: query
                  name: summaryOnly
                  required: false
                  description: >-
                      Con `true` responde solo totales y desglose, sin detalle
                      de partidos (`matches: []`).
                  schema:
                      type: boolean
                      default: false
            responses:
                "200":
                    description: Resumen de pendientes con el detalle acotado
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/AssistantPendingMatchesResponse"
                "400":
                    $ref: "#/components/responses/BadRequest"
                "401":
                    description: Secreto ausente o inválido (INVALID_RECAP_SECRET)
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/ErrorResponse"
                "404":
                    $ref: "#/components/responses/NotFound"
                "429":
                    description: Demasiados secretos inválidos desde la misma IP (TOO_MANY_RECAP_ATTEMPTS)
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/ErrorResponse"
                "503":
                    description: El secreto no está configurado en el servidor (RECAP_SECRET_NOT_CONFIGURED)
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/ErrorResponse"

    /api/assistant/head-to-head:
        get:
            tags: [Assistant]
            summary: Historial entre dos jugadores, para el agente del chat
            description: >-
                Lo llama el agente de n8n (solo lectura, mismo secreto que los
                recaps). Lee solo los partidos jugados entre los dos jugadores,
                a diferencia de `GET /api/statistics/all-time/face-to-face`, que
                arma el cruce de todos contra todos.


                **Balance.** `record` cuenta todos los partidos válidos del
                par, desde el punto de vista de `playerA`. El criterio es el
                del sitio: se decide por el marcador y un empate en goles es
                empate aunque se haya definido por penales (esos partidos se
                cuentan aparte en `record.shootouts`). Los partidos inválidos
                (`valid: false`: W.O., gol de oro, simulados) y los sin goles
                completos no cuentan y se informan en `excluded`.


                **Detalle acotado.** `lastMatches` trae los últimos `limit`
                partidos, del más nuevo al más viejo (los sin fecha al final):
                5 por defecto y un valor mayor a 10 se ajusta a 10. Cada uno
                lleva fecha (día argentino según la precisión con que se
                cargó), torneo, etapa, ronda de playoff, equipos, goles,
                ganador, penales y `ratingChange` (puntos de rating de cada
                jugador, si el read-model está fresco; si no, el campo no se
                envía). `bestWin` es la mayor victoria de cada jugador (mayor
                diferencia, luego más goles, luego el partido más viejo) y
                `streak` la racha actual de victorias de un jugador o de
                empates.


                `viewPath` lleva al listado de partidos del sitio filtrado por
                los dos jugadores. Un jugador inexistente no es error: la
                respuesta trae `unknownPlayers`, `record: null` y una nota. Dos
                ids iguales son 400.
            security:
                - recapSecret: []
            parameters:
                - in: query
                  name: playerA
                  required: true
                  schema:
                      type: string
                - in: query
                  name: playerB
                  required: true
                  description: Distinto de `playerA`
                  schema:
                      type: string
                - in: query
                  name: stage
                  required: false
                  description: >-
                      Cuenta solo los partidos de esa etapa ("¿cómo me fue contra
                      Max en playoffs?"). El balance y los últimos partidos se
                      acotan igual.
                  schema:
                      type: string
                      enum: [regular, playin, playoff]
                - in: query
                  name: tournamentId
                  required: false
                  description: Cuenta solo los partidos de ese torneo
                  schema:
                      $ref: "#/components/schemas/MongoId"
                - in: query
                  name: limit
                  required: false
                  description: Últimos partidos detallados (máximo efectivo 10)
                  schema:
                      type: integer
                      minimum: 1
                      default: 5
            responses:
                "200":
                    description: Balance y últimos enfrentamientos
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/AssistantHeadToHeadResponse"
                "400":
                    $ref: "#/components/responses/BadRequest"
                "401":
                    description: Secreto ausente o inválido (INVALID_RECAP_SECRET)
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/ErrorResponse"
                "429":
                    description: Demasiados secretos inválidos desde la misma IP (TOO_MANY_RECAP_ATTEMPTS)
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/ErrorResponse"
                "503":
                    description: El secreto no está configurado en el servidor (RECAP_SECRET_NOT_CONFIGURED)
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/ErrorResponse"

    /api/assistant/recent-matches:
        get:
            tags: [Assistant]
            summary: Últimos partidos jugados de un jugador, para el agente del chat
            description: >-
                Lo llama el agente de n8n (solo lectura, mismo secreto que los
                recaps). Lee solo los partidos jugados del jugador contra
                cualquier rival (no hay filtro por rival: para un cara a cara
                existe `GET /api/assistant/head-to-head`). Los pendientes no
                se incluyen.


                **Detalle acotado.** `matches` trae los últimos `limit`
                partidos, del más nuevo al más viejo (los sin fecha al final,
                mismo criterio que el cara a cara): 10 por defecto y un valor
                mayor a 20 se ajusta a 20. Cada partido se ve desde el
                jugador consultado: `score` son sus goles primero, `result`
                es `win`, `draw` o `loss`, y `opponent`, `playerTeam` y
                `opponentTeam` son nombres (la respuesta no lleva ids de
                partido ni de torneo). El criterio es el del sitio: un empate
                en goles es empate aunque se haya definido por penales (se
                informan aparte en `shootout`). Los partidos inválidos
                (`valid: false`) y los sin goles completos no cuentan y se
                informan en `excluded`.


                **Rating.** `ratingChange` son los puntos de APA Rating que
                ganó o perdió el jugador consultado en ese partido (negativo si
                perdió). Es `null` si no hay dato (read-model desactualizado o
                partido sin evento): el campo siempre se envía.


                **Resumen.** Se calcula sobre los partidos devueltos, no sobre
                `totalMatches`: `record`, `ratingChangeTotal` (suma de los que
                tienen dato; `null` si ninguno), `withoutRatingChange` (cuántos
                no tienen dato), `biggestRatingLoss` y `biggestRatingGain` (el
                partido con la mayor pérdida o ganancia; `null` si ninguno
                perdió o ganó puntos; ante igualdad, el más nuevo).


                `viewPath` lleva al listado de partidos del sitio filtrado por
                el jugador (`/matches?player1=...`). Un jugador inexistente no
                es error: la respuesta es 200 con `player: null`,
                `unknownPlayers`, `record: null` y una nota.
            security:
                - recapSecret: []
            parameters:
                - in: query
                  name: player
                  required: true
                  description: Id del jugador (el que devuelve `GET /api/users`)
                  schema:
                      type: string
                - in: query
                  name: stage
                  required: false
                  description: Cuenta solo los partidos de esa etapa
                  schema:
                      type: string
                      enum: [regular, playin, playoff]
                - in: query
                  name: tournamentId
                  required: false
                  description: Cuenta solo los partidos de ese torneo
                  schema:
                      $ref: "#/components/schemas/MongoId"
                - in: query
                  name: limit
                  required: false
                  description: Últimos partidos detallados (máximo efectivo 20)
                  schema:
                      type: integer
                      minimum: 1
                      default: 10
            responses:
                "200":
                    description: Últimos partidos del jugador y resumen
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/AssistantRecentMatchesResponse"
                "400":
                    $ref: "#/components/responses/BadRequest"
                "401":
                    description: Secreto ausente o inválido (INVALID_RECAP_SECRET)
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/ErrorResponse"
                "429":
                    description: Demasiados secretos inválidos desde la misma IP (TOO_MANY_RECAP_ATTEMPTS)
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/ErrorResponse"
                "503":
                    description: El secreto no está configurado en el servidor (RECAP_SECRET_NOT_CONFIGURED)
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/ErrorResponse"

    /api/assistant/champions:
        get:
            tags: [Assistant]
            summary: Campeones, subcampeones y títulos de todos los torneos terminados, para el agente del chat
            description: >-
                Lo llama el agente de n8n (solo lectura, mismo secreto que los
                recaps). No tiene parámetros: el palmarés completo es chico y
                cualquier query da 400.


                **Qué cuenta.** Los mismos torneos que el Salón de la Fama del
                sitio: terminados (`ongoing: false`), válidos (`valid` distinto
                de `false`) y con campeón registrado, **incluidos los
                históricos de 2016 a 2019** (`legacy: true`), que no tienen
                partidos cargados pero sí campeón y finalista. A diferencia de
                `GET /api/tournaments?legacy=false`, que los deja afuera. Los
                torneos en curso y los inválidos no cuentan. Un torneo
                terminado y válido sin campeón se informa en `notes`.


                **Torneos.** `tournaments` va del más nuevo al más viejo (el
                primero es el último campeón). Cada fila trae `champion` y
                `runnerUp` con el nombre del jugador y del equipo, la fecha de
                cierre (`closedOn`, solo el año en los históricos) y
                `legacy: true` si es histórico. Dos torneos pueden tener el
                mismo nombre base (Copa del Mundo 2018 y su versión Juego
                Oficial): son filas separadas.


                **Jugadores.** `players` trae, ya contados, `titles` y
                `runnerUps` de cada jugador (los usuarios sin títulos van con
                0), su `rank` y los nombres de los torneos de cada uno. Si
                campeón y subcampeón son la misma persona (dos equipos suyos o,
                en una liga, primero y segundo), el torneo cuenta como título y
                no como subcampeonato, y la fila lleva
                `sameChampionAndRunnerUp: true`. El nombre es el apodo actual
                del usuario; si el id ya no es un usuario, el que quedó
                guardado al cerrar el torneo.


                La respuesta no lleva ids. `viewPath` lleva al Salón de la Fama
                del sitio.
            security:
                - recapSecret: []
            responses:
                "200":
                    description: Palmarés por torneo y por jugador
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/AssistantChampionsResponse"
                "400":
                    $ref: "#/components/responses/BadRequest"
                "401":
                    description: Secreto ausente o inválido (INVALID_RECAP_SECRET)
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/ErrorResponse"
                "429":
                    description: Demasiados secretos inválidos desde la misma IP (TOO_MANY_RECAP_ATTEMPTS)
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/ErrorResponse"
                "503":
                    description: El secreto no está configurado en el servidor (RECAP_SECRET_NOT_CONFIGURED)
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/ErrorResponse"

    /api/assistant/standings:
        get:
            tags: [Assistant]
            summary: Tabla de posiciones compacta de un torneo, para el agente del chat
            description: >-
                Lo llama el agente de n8n (solo lectura, mismo secreto que los
                recaps). Usa el mismo cálculo que `GET
                /api/tournaments/{tournament}/standings/table` (puntos,
                desempates, indicadores de clasificación) pero devuelve solo
                lo que el agente necesita: cada fila trae posición, jugador,
                equipo, partidos, victorias, empates, derrotas, goles, puntos,
                `form` (los últimos 5 resultados de más viejo a más nuevo, con
                W, D y L) y, si corresponde, `qualification`. Se omiten las
                jornadas completas que el endpoint original trae por equipo,
                que son la mayor parte de su tamaño.


                `qualification` es un texto listo para decir y solo existe en
                la Liga (el equipo ya no puede alcanzar al líder) y en la
                Superliga (clasificado directo, play-in asegurado o
                eliminado). En los demás formatos con grupos clasifican el 1°
                y el 2° (más los mejores terceros en algunos), y eso no se
                calcula acá.


                `playerId` deja solo las filas de ese jugador, con su
                posición real dentro del grupo. Un torneo de eliminación
                directa o histórico no tiene tabla: `hasTable` es `false` y
                `standings` va vacío. Un torneo inexistente es 404.
            security:
                - recapSecret: []
            parameters:
                - in: query
                  name: tournamentId
                  required: true
                  schema:
                      $ref: "#/components/schemas/MongoId"
                - in: query
                  name: group
                  required: false
                  description: Solo ese grupo (en los formatos con grupos)
                  schema:
                      type: string
                      enum: [A, B, C, D, E, F, G, H, I, J, K, L]
                - in: query
                  name: playerId
                  required: false
                  description: Solo los equipos de ese jugador
                  schema:
                      type: string
            responses:
                "200":
                    description: Tabla compacta
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/AssistantStandingsResponse"
                "400":
                    $ref: "#/components/responses/BadRequest"
                "401":
                    description: Secreto ausente o inválido (INVALID_RECAP_SECRET)
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/ErrorResponse"
                "404":
                    $ref: "#/components/responses/NotFound"
                "429":
                    description: Demasiados secretos inválidos desde la misma IP (TOO_MANY_RECAP_ATTEMPTS)
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/ErrorResponse"
                "503":
                    description: El secreto no está configurado en el servidor (RECAP_SECRET_NOT_CONFIGURED)
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/ErrorResponse"

    /api/tournament-recaps/pending:
        get:
            tags: [Recaps]
            summary: Torneos terminados que todavía no tienen recap
            description: >-
                Lo llama el workflow de n8n una vez por día. Devuelve los
                torneos terminados (`ongoing: false`), válidos, no legacy y
                con campeón que no tienen recap, con `closedAt` dentro de
                `[closedAfter, hoy)` (días calendario de Argentina; un torneo
                que cierra hoy entra mañana) y con al menos un partido jugado
                y válido. Se ordenan por `closedAt` ascendente y se cortan en
                `limit`. Sin `closedAfter` la ventana es de 7 días.


                `counts` explica la diferencia con el total: los torneos sin
                `closedAt` (`skippedWithoutClosedAt`) no se pueden ubicar en la
                ventana y se cuentan en lugar de perderse en silencio.
                `backlog` lista, sin ventana ni límite, los torneos terminados
                con partidos y sin recap (solo identificación, de más viejo a
                más nuevo): es el listado para un backfill controlado, uno por
                vez, pasando el `tournamentId` al contexto. `backlog` no lista
                los torneos de `BACKFILL_EXCLUDED_TOURNAMENTS`
                (`config/tournamentRecap.js`; hoy Chempions 2019/20, cuyo
                contexto compact supera el tope de tamaño): son torneos viejos
                que se eligen a mano. La exclusión solo afecta a `backlog`: no
                cambia la ventana diaria (`data`), ni `counts`, ni el
                contexto, que sigue respondiendo para ese `tournamentId`.
                Solo lectura.
            security:
                - recapSecret: []
            parameters:
                - in: query
                  name: closedAfter
                  required: false
                  description: >-
                      Primer día (inclusive, YYYY-MM-DD) de la ventana de cierre.
                      Por defecto, hoy menos 7 días.
                  schema:
                      type: string
                      pattern: "^\\d{4}-\\d{2}-\\d{2}$"
                      example: "2026-10-14"
                - in: query
                  name: limit
                  required: false
                  schema:
                      type: integer
                      minimum: 1
                      maximum: 20
                      default: 3
            responses:
                "200":
                    description: Torneos a procesar y listado de backfill
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/TournamentRecapPending"
                "400":
                    $ref: "#/components/responses/BadRequest"
                "401":
                    description: Secreto ausente o inválido (INVALID_RECAP_SECRET)
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/ErrorResponse"
                "429":
                    description: Demasiados secretos inválidos desde la misma IP (TOO_MANY_RECAP_ATTEMPTS)
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/ErrorResponse"
                "503":
                    description: El secreto no está configurado en el servidor (RECAP_SECRET_NOT_CONFIGURED)
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/ErrorResponse"
    /api/tournament-recaps/context:
        get:
            tags: [Recaps]
            summary: Contexto completo de un torneo terminado para escribir su recap
            description: >-
                Lo llama el workflow de n8n por cada torneo. El servidor
                calcula todo lo que es número, orden, racha, récord o conteo
                histórico y entrega una lista priorizada de hechos (`facts`);
                el modelo de lenguaje solo redacta. Una lectura de los partidos
                del torneo, una de la lista de torneos y el historial de
                ratings cacheado.


                Las probabilidades (`odds`) son por partido, nunca por serie:
                en liga y en las patas 1 y 2 de un cruce a dos partidos son
                victoria / empate / derrota (`expected_points`); en un cruce de
                partido único es la probabilidad de avanzar (`advance`); sin
                predicción con sentido (pata 3 a gol de oro, play-in de la
                Champions) o sin evento de rating (`valid: false`), `null`.
                V/E/D se cuenta por `outcome` (quien gana por penales suma
                una victoria; los penales se informan aparte), a diferencia de
                `/api/tournaments/{tournament}/summary`, que cuenta por signo
                del marcador.


                `titleContext` cuenta todos los torneos del Salón de la Fama
                (terminados, válidos, con campeón, legacy incluidos) hasta el
                cierre de este torneo. La competencia ("su 4ta Superliga") sale
                del `format` del torneo y no de su nombre: `league_playin_playoff`
                es Superliga, `league` Liga, `playoff` Eliminatoria,
                `world_cup` y `world_cup_2026` Mundial, `champions_league`
                Champions, `super_cup` Supercopa, `american_cup` Copa América y
                `club_world_cup` Mundial de Clubes (estos dos últimos son formatos
                legacy: no se pueden crear, pero cuentan como familia propia). Un formato ausente o desconocido queda en una familia
                aparte, con una advertencia en `dataQuality.warnings`.


                Los contadores de `titleContext` (`ranking[]`, `champion` y
                `runnerUp`) INCLUYEN este torneo (`countsIncludeThisTournament`)
                y se cuentan por torneo, una sola vez por jugador:
                `titles` (campeonatos), `runnerUps` (subcampeonatos de
                cualquier formato, también `league`, en torneos que el
                jugador no ganó), `titlesAndRunnerUps` (torneos distintos con
                título o subcampeonato, igual a `titles + runnerUps`) y
                `finalsPlayed` / `finalsWon` / `finalsLost` (solo formatos con
                final: todos menos `league`, que tiene campeón y subcampeón
                pero no final). Un jugador con los dos equipos de la final es
                campeón: cuenta un título y una final ganada, no un
                subcampeonato. `beforeThisTournament` repite los seis
                contadores sin este torneo y `sameCompetition` solo para
                torneos de la misma familia (la de `competition`).


                `playerStats.players[].performanceVsExpectedPct` es el
                rendimiento del jugador contra lo que predecía el Elo, en
                porcentaje entero con signo: `(reales / esperados - 1) * 100`
                sobre los puntos (3 por victoria, 1 por empate) de los mismos
                partidos con predicción. `+24` es 24 % más puntos de los
                esperados y `-40`, 40 % menos. En un cruce de partido único la
                escala es la misma (ganar vale 3, también por penales, y lo
                esperado es 3 por la probabilidad de avanzar). Es `null`
                con menos de 3 partidos con predicción o sin puntos esperados.


                Todo número de movimiento de Elo del torneo sale solo de los
                eventos de rating de los partidos de este torneo: `delta` es
                lo que cada jugador ganó o perdió en el torneo (y la única
                cifra para decirlo), y `bestCumulativeDelta` /
                `worstCumulativeDelta` son el punto más alto y el más bajo de
                ese delta acumulado desde 0. Los ratings globales
                (`globalRatingBeforeFirstMatch`, `globalRatingAfterLastMatch`,
                `globalPeakRating`) y `leaderboard` pueden incluir partidos de
                otros torneos jugados en el medio (`dataQuality.warnings`
                informa cuántos) y no son lo ganado en el torneo.


                Los partidos `valid: false` (por ejemplo entre dos equipos del
                mismo jugador, cargados para avanzar el cuadro) no cuentan en
                ninguna estadística: `playerStats`, `headToHead`,
                `ratingMovement` y `facts` los ignoran y `compact` no los
                destaca entre los regulares. La tabla de `standings` sí los
                cuenta (la tabla de la liga los necesita) y lo aclara en
                `standings.criterion`: su `played` puede no coincidir con
                el PJ de `playerStats`.


                Con `detail=compact` (por defecto) van todos los partidos de
                play-in y playoff y los partidos regulares destacados (hasta
                15); `matchesOmitted` dice cuántos quedaron afuera. Con `full`,
                todos. `meta.contextHash` es el sha256 del JSON de `data`; no
                incluye la hora de la consulta, así que dos pedidos sin cambios
                dan el mismo hash (y `compact` y `full` dan hashes distintos).
                Solo lectura.
            security:
                - recapSecret: []
            parameters:
                - in: query
                  name: tournamentId
                  required: true
                  schema:
                      type: string
                      pattern: "^[a-fA-F0-9]{24}$"
                - in: query
                  name: detail
                  required: false
                  schema:
                      type: string
                      enum: [compact, full]
                      default: compact
            responses:
                "200":
                    description: Contexto del torneo
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/TournamentRecapContext"
                "400":
                    $ref: "#/components/responses/BadRequest"
                "401":
                    description: Secreto ausente o inválido (INVALID_RECAP_SECRET)
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/ErrorResponse"
                "404":
                    $ref: "#/components/responses/NotFound"
                "409":
                    description: El torneo todavía no terminó (TOURNAMENT_NOT_FINISHED)
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/ErrorResponse"
                "422":
                    description: El torneo no tiene partidos jugados y válidos, por ejemplo un legacy (TOURNAMENT_WITHOUT_MATCHES)
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/ErrorResponse"
                "429":
                    description: Demasiados secretos inválidos desde la misma IP (TOO_MANY_RECAP_ATTEMPTS)
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/ErrorResponse"
                "503":
                    description: El secreto no está configurado en el servidor (RECAP_SECRET_NOT_CONFIGURED)
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/ErrorResponse"
    /api/tournament-recaps:
        post:
            tags: [Recaps]
            summary: Guarda el recap de un torneo generado por n8n
            description: >-
                Lo llama el workflow de n8n, no el FE. Hay un recap por
                `tournamentId`: reenviar el de un torneo que ya tiene uno lo
                reemplaza (200, `revision` suma 1) en lugar de duplicarlo (201
                al crearlo, `revision` 1). `tournament`, `format` y `closedAt`
                se copian del torneo, no se aceptan en el body.


                Además de validar el body, comprueba contra la base que el
                torneo exista (404), esté terminado (409) y tenga partidos
                jugados y válidos (422 `TOURNAMENT_WITHOUT_MATCHES`), y que el
                texto tenga los títulos `##` que exige el formato (siempre "El
                campeón" y "Salón de la fama", que también acepta con el
                nombre anterior "En la historia"; "Fase regular" o "Fase de grupos",
                "Play-in" y "Playoffs" según las etapas) y nombre al campeón y
                al subcampeón, jugador y equipo (422
                `TOURNAMENT_RECAP_CONTENT_INVALID`, con lo que falta en
                `error.details`). Es una defensa contra respuestas vacías o
                cortadas, no contra errores de hecho.
            security:
                - recapSecret: []
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: "#/components/schemas/TournamentRecapRequest"
            responses:
                "200":
                    description: Ya existía un recap de ese torneo y fue reemplazado
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/TournamentRecapSaved"
                "201":
                    description: Recap creado
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/TournamentRecapSaved"
                "400":
                    $ref: "#/components/responses/BadRequest"
                "401":
                    description: Secreto ausente o inválido (INVALID_RECAP_SECRET)
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/ErrorResponse"
                "404":
                    $ref: "#/components/responses/NotFound"
                "409":
                    description: El torneo todavía no terminó (TOURNAMENT_NOT_FINISHED)
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/ErrorResponse"
                "422":
                    description: >-
                        El torneo no tiene partidos jugados y válidos
                        (TOURNAMENT_WITHOUT_MATCHES) o el texto no cumple el
                        contrato de contenido (TOURNAMENT_RECAP_CONTENT_INVALID)
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/ErrorResponse"
                "429":
                    description: Demasiados secretos inválidos desde la misma IP (TOO_MANY_RECAP_ATTEMPTS)
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/ErrorResponse"
                "503":
                    description: El secreto no está configurado en el servidor (RECAP_SECRET_NOT_CONFIGURED)
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/ErrorResponse"

components:
    securitySchemes:
        bearerAuth:
            type: http
            scheme: bearer
            bearerFormat: JWT
        recapSecret:
            type: apiKey
            in: header
            name: X-Recap-Secret
    parameters:
        TournamentId:
            in: path
            name: tournament
            required: true
            schema:
                $ref: "#/components/schemas/MongoId"
        MatchId:
            in: path
            name: match
            required: true
            schema:
                $ref: "#/components/schemas/MongoId"
    responses:
        BadRequest:
            description: Solicitud inválida
            content:
                application/json:
                    schema:
                        $ref: "#/components/schemas/ErrorResponse"
        InvalidSession:
            description: Sesión ausente o inválida
            content:
                application/json:
                    schema:
                        $ref: "#/components/schemas/ErrorResponse"
        Forbidden:
            description: Usuario autenticado sin permisos sobre el recurso
            content:
                application/json:
                    schema:
                        $ref: "#/components/schemas/ErrorResponse"
        NotFound:
            description: Recurso inexistente
            content:
                application/json:
                    schema:
                        $ref: "#/components/schemas/ErrorResponse"
        PlayoffResultBadRequest:
            description: >-
                VALIDATION_ERROR, INVALID_MATCH_RESULT, PENALTIES_NOT_ALLOWED,
                PENALTIES_REQUIRED, PENALTIES_INCOMPLETE, PENALTIES_TIED,
                PENALTIES_WITH_REGULATION_WINNER o EXPECTED_SERIES_REVISION_REQUIRED.
            content:
                application/json:
                    schema:
                        $ref: "#/components/schemas/ErrorResponse"
        PlayoffMutationConflict:
            description: >-
                REGULAR_PHASE_CLOSED, PLAYOFF_LATER_LEG_PLAYED,
                PLAYOFF_SERIES_ADVANCED, PLAYOFF_STATE_CONFLICT,
                PLAYOFF_DUPLICATE_LEG, PLAYOFF_SLOT_CONFLICT,
                PLAYOFF_COMPETITOR_CONFLICT, PLAYOFF_SERIES_NOT_READY o
                PLAYOFF_CONFIGURATION_ERROR. PLAYOFF_SERIES_ADVANCED también
                protege de forma fail-closed una final ya cerrada; no se ejecutan cascadas.
            content:
                application/json:
                    schema:
                        $ref: "#/components/schemas/ErrorResponse"
        RegularPhaseClosed:
            description: REGULAR_PHASE_CLOSED. El partido es de fase regular y la eliminatoria ya fue generada (el play-in de su zona en league_playin_playoff, el playoff en el resto de los formatos)
            content:
                application/json:
                    schema:
                        $ref: "#/components/schemas/ErrorResponse"
    schemas:
        RatingParameters:
            type: object
            description: Parámetros con los que se calculó el Elo
            properties:
                version:
                    type: string
                    description: Versión del APA Rating (ver docs/APA-RATING.md)
                    example: "2.0"
                initialRating:
                    type: number
                kFactor:
                    type: number
                marginWeight:
                    type: number
                teamStrengthWeight:
                    type: number
                    description: >-
                        Puntos Elo que suma el puntaje esperado por cada punto
                        de "overall" de Sofifa del equipo usado. Con 25, una
                        brecha de 10 de overall pesa 250 puntos Elo. 0 es el
                        rating 1.0 (sin fuerza de equipos).
                    example: 25
                provisionalMatches:
                    type: integer
        RatingPlayer:
            type: object
            properties:
                id:
                    type: string
                name:
                    type: string
        RatingRow:
            type: object
            properties:
                position:
                    type: integer
                    minimum: 1
                player:
                    $ref: "#/components/schemas/RatingPlayer"
                rating:
                    type: number
                matches:
                    type: integer
                wins:
                    type: integer
                draws:
                    type: integer
                losses:
                    type: integer
                peak:
                    type: number
                    description: Máximo rating alcanzado
                provisional:
                    type: boolean
                lastPlayedAt:
                    type: string
                    format: date-time
                    nullable: true
                lastChange:
                    type: number
                    nullable: true
                    description: Variación de rating en su último partido
        RatingPeriodRow:
            type: object
            properties:
                position:
                    type: integer
                previousPosition:
                    type: integer
                    nullable: true
                positionChange:
                    type: integer
                    nullable: true
                    description: Lugares que subió (positivo) o bajó (negativo)
                player:
                    $ref: "#/components/schemas/RatingPlayer"
                rating:
                    type: number
                previousRating:
                    type: number
                    nullable: true
                ratingChange:
                    type: number
                matchesInPeriod:
                    type: integer
                record:
                    type: object
                    properties:
                        wins:
                            type: integer
                        draws:
                            type: integer
                        losses:
                            type: integer
                provisional:
                    type: boolean
        RecapTournamentContext:
            type: object
            properties:
                tournamentId:
                    type: string
                tournament:
                    type: string
                format:
                    type: string
                    enum:
                        [
                            american_cup,
                            champions_league,
                            club_world_cup,
                            league,
                            league_playin_playoff,
                            playoff,
                            super_cup,
                            world_cup,
                            world_cup_2026,
                        ]
                    description: |
                        `american_cup` y `club_world_cup` son formatos legacy: existen
                        en torneos legacy y son válidos en el modelo, pero no se pueden
                        crear (`CreateTournamentRequest.format` no los acepta).
                ongoing:
                    type: boolean
                    description: Valor actual, no el de `date`
                asOf:
                    type: object
                    description: Momento al que corresponde cada parte de la respuesta
                    properties:
                        standings:
                            type: string
                            description: Fecha de cierre de la tabla (la de la consulta)
                        playin:
                            type: string
                            enum: [current]
                        bracket:
                            type: string
                            enum: [current]
                rules:
                    type: object
                    description: Reglas fijas del formato, como insumo para explicar sin inferir
                    properties:
                        stages:
                            type: array
                            items:
                                type: string
                                enum: [regular, playin, playoff]
                        description:
                            type: string
                            nullable: true
                        tableTiebreak:
                            type: string
                            nullable: true
                        qualification:
                            type: object
                            nullable: true
                            additionalProperties: true
                        knockout:
                            type: string
                            nullable: true
                playoffStartRound:
                    type: string
                    nullable: true
                    enum:
                        [
                            round_of_32,
                            round_of_16,
                            quarterfinal,
                            semifinal,
                            final,
                        ]
                    description: >-
                        Primera ronda de eliminación del formato (la que
                        disputan `getPlayoffStartSize` equipos). `null` si el
                        formato no tiene playoff.
                standings:
                    type: array
                    description: Una entrada por grupo (`group` null si no hay grupos); vacío en formatos sin fase regular
                    items:
                        type: object
                        properties:
                            group:
                                type: string
                                nullable: true
                            teams:
                                type: array
                                items:
                                    type: object
                                    description: Fila de la tabla al cierre de `date`, con `position` y `previousPosition` (base 1; la de inicio del día, o null si nadie había jugado en el grupo); sin `streak`
                                    additionalProperties: true
                playin:
                    type: array
                    items:
                        $ref: "#/components/schemas/RecapContextMatch"
                bracket:
                    type: array
                    description: Cruces de playoff con al menos un equipo definido, por `playoffId`
                    items:
                        type: object
                        properties:
                            playoffId:
                                type: integer
                            round:
                                type: string
                                nullable: true
                                enum:
                                    [
                                        round_of_32,
                                        round_of_16,
                                        quarterfinal,
                                        semifinal,
                                        final,
                                    ]
                            nextRound:
                                type: string
                                nullable: true
                                enum:
                                    [
                                        round_of_32,
                                        round_of_16,
                                        quarterfinal,
                                        semifinal,
                                        final,
                                    ]
                                description: >-
                                    Ronda a la que pasa el ganador del cruce.
                                    `null` en la final.
                            series:
                                type: object
                                nullable: true
                                description: Estado de la serie (sólo formato `playoff`)
                                additionalProperties: true
                            matches:
                                type: array
                                items:
                                    $ref: "#/components/schemas/RecapContextMatch"
                matchInsights:
                    type: array
                    description: >-
                        Un ítem por partido rateado de este torneo jugado en
                        `date` (día de Argentina), ordenado por `playedAt`
                        ascendente. Vacío si no hubo partidos rateados. No
                        incluye partidos `valid: false` (W/O, gol de oro,
                        simulados), sin jugar ni sin goles: el motor de ratings
                        no los califica.
                    items:
                        $ref: "#/components/schemas/RecapMatchInsight"
        RecapMatchInsightSide:
            type: object
            required: [player, team, ratingBefore, teamOverall]
            properties:
                player:
                    type: object
                    required: [id, name]
                    properties:
                        id:
                            type: string
                        name:
                            type: string
                team:
                    type: object
                    required: [id, name]
                    properties:
                        id:
                            type: integer
                            nullable: true
                        name:
                            type: string
                            nullable: true
                ratingBefore:
                    type: number
                    description: Rating del jugador justo antes del partido (1 decimal)
                teamOverall:
                    type: number
                    nullable: true
                    description: >-
                        Overall del equipo (Sofifa). `null` si falta el de
                        cualquiera de los dos equipos: en ese caso el partido se
                        calculó sin término de equipo y `teamAdjustment` es 0.
        RecapMatchInsight:
            type: object
            description: >-
                Datos de un partido rateado, para que el consumidor decida qué
                es una sorpresa. Los números son crudos; `favorite` usa los
                niveles del asistente (`FAVORITE_LEVELS`) y `ratingEdge` y
                `overallGap` traen niveles ya calculados
                (`config/recapInsights.js`).
            required:
                - matchId
                - playedAt
                - type
                - playoffId
                - leg
                - p1
                - p2
                - scoreP1
                - scoreP2
                - expectedP1
                - teamAdjustment
                - kind
                - favorite
                - ratingEdge
                - overallGap
                - winner
                - winnerExpectedScore
                - ratingSwing
            properties:
                matchId:
                    type: string
                playedAt:
                    type: string
                    format: date-time
                type:
                    type: string
                    enum: [regular, playin, playoff]
                playoffId:
                    type: integer
                    nullable: true
                leg:
                    type: integer
                    nullable: true
                p1:
                    $ref: "#/components/schemas/RecapMatchInsightSide"
                p2:
                    $ref: "#/components/schemas/RecapMatchInsightSide"
                scoreP1:
                    type: integer
                scoreP2:
                    type: integer
                expectedP1:
                    type: number
                    minimum: 0
                    maximum: 1
                    description: >-
                        Puntaje esperado de P1 antes del partido (3 decimales),
                        con el término de fuerza de equipo incluido. No es la
                        probabilidad de ganar salvo cuando `kind` es `advance`.
                teamAdjustment:
                    type: number
                    description: >-
                        Puntos Elo a favor de P1 que sumó el término de equipo
                        (1 decimal). 0 si no se aplicó.
                kind:
                    type: string
                    nullable: true
                    enum: [advance, expected_points]
                    description: >-
                        Cómo leer `expectedP1`. `advance`: cruce de partido
                        único, es la probabilidad de avanzar (el empate se
                        define por alargue y penales); incluye el play-in de los
                        formatos que no son `champions_league`.
                        `expected_points`: el partido puede terminar empatado
                        (liga, patas 1 y 2 de un cruce de ida y vuelta,
                        playoffs de `champions_league`) y el empate vale 0,5, de
                        modo que NO es la probabilidad de ganar. `null`: sin
                        predicción con sentido (pata 3 que desempata a gol de
                        oro, play-in de `champions_league`). Sale de
                        `predictionKind` (`service/playerRatings/prediction.js`).
                favorite:
                    type: object
                    nullable: true
                    required: [side, label]
                    description: >-
                        Favorito del partido según el puntaje esperado,
                        con las mismas etiquetas del asistente. `null` si el
                        duelo es parejo (por debajo de "levemente favorito") o
                        `kind` es `null`.
                    properties:
                        side:
                            type: string
                            enum: [p1, p2]
                        label:
                            type: string
                            enum: [levemente favorito, favorito, gran favorito]
                ratingEdge:
                    type: object
                    nullable: true
                    required: [side, level]
                    description: >-
                        Ventaja de rating entre los jugadores (sin equipo):
                        `slight` desde 25 puntos, `clear` desde 75 y
                        `large` desde 150. `side` es el de más rating.
                        `null` por debajo de 25.
                    properties:
                        side:
                            type: string
                            enum: [p1, p2]
                        level:
                            type: string
                            enum: [slight, clear, large]
                overallGap:
                    type: object
                    nullable: true
                    required: [side, points, level]
                    description: >-
                        Diferencia de overall entre los equipos: `notable`
                        desde 4 puntos y `large` desde 8. `side` es el de
                        más overall. `null` si falta algún overall o la
                        diferencia es menor a 4.
                    properties:
                        side:
                            type: string
                            enum: [p1, p2]
                        points:
                            type: number
                        level:
                            type: string
                            enum: [notable, large]
                winner:
                    type: string
                    enum: [p1, p2, draw]
                    description: >-
                        Sale de `outcome` y no del marcador: un cruce definido
                        por penales tiene goles iguales pero ganador. `draw` solo
                        si el partido terminó realmente empatado.
                winnerExpectedScore:
                    type: number
                    nullable: true
                    description: >-
                        Puntaje esperado del lado ganador antes del partido
                        (`expectedP1` si ganó P1, `1 - expectedP1` si ganó P2;
                        3 decimales). `null` si fue empate. Un valor bajo indica
                        que ganó el menos favorecido.
                ratingSwing:
                    type: number
                    minimum: 0
                    description: >-
                        Puntos de rating que cambió el partido, `abs(delta)` (1
                        decimal). Misma unidad que `ratingSwing` de
                        `highlights.biggestUpset` en `/api/ratings/period`.
        RecapContextMatch:
            type: object
            properties:
                playoffId:
                    type: integer
                    nullable: true
                leg:
                    type: integer
                    nullable: true
                played:
                    type: boolean
                valid:
                    type: boolean
                    description: >-
                        `false` si el resultado se cargó sólo para que avance el
                        cuadro (por ejemplo un W/O o un desempate): el partido no
                        cuenta para estadísticas ni para el recap. Es `true`
                        salvo que el partido tenga `valid: false`.
                playedAt:
                    type: string
                    format: date-time
                    nullable: true
                playerP1:
                    type: object
                    nullable: true
                    additionalProperties: true
                teamP1:
                    type: object
                    nullable: true
                    additionalProperties: true
                seedP1:
                    type: string
                    nullable: true
