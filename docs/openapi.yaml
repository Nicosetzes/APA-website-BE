        TournamentRecapPending:
            type: object
            required:
                [success, closedAfter, before, limit, data, counts, backlog]
            properties:
                success:
                    type: boolean
                closedAfter:
                    type: string
                    description: Valor efectivo (por defecto, hoy menos 7 días)
                    example: "2026-10-14"
                before:
                    type: string
                    description: Hoy (día de Argentina); límite superior exclusivo
                    example: "2026-10-21"
                limit:
                    type: integer
                data:
                    type: array
                    items:
                        $ref: "#/components/schemas/TournamentRecapPendingItem"
                counts:
                    type: object
                    required:
                        - finishedEligible
                        - withRecap
                        - inWindowWithoutRecap
                        - skippedWithoutClosedAt
                        - skippedWithoutMatches
                        - returned
                    properties:
                        finishedEligible:
                            type: integer
                            description: Terminados, válidos, no legacy y con campeón (toda la historia)
                        withRecap:
                            type: integer
                        inWindowWithoutRecap:
                            type: integer
                            description: Dentro de la ventana y sin recap, antes del límite y del filtro de partidos
                        skippedWithoutClosedAt:
                            type: integer
                            description: Sin recap y sin `closedAt`, que no se pueden ubicar en la ventana
                        skippedWithoutMatches:
                            type: integer
                            description: Dentro de la ventana, sin partidos jugados y válidos
                        returned:
                            type: integer
                backlog:
                    type: object
                    description: >-
                        Torneos terminados con partidos y sin recap, sin ventana
                        ni límite (backfill controlado), sin los de
                        `BACKFILL_EXCLUDED_TOURNAMENTS` (Chempions 2019/20).
                        `count` cuenta solo los listados.
                    required: [count, tournaments]
                    properties:
                        count:
                            type: integer
                        tournaments:
                            type: array
                            items:
                                type: object
                                required: [tournamentId, name, format, closedAt]
                                properties:
                                    tournamentId:
                                        type: string
                                    name:
                                        type: string
                                    format:
                                        type: string
                                    closedAt:
                                        type: string
                                        format: date-time
                                        nullable: true
        TournamentRecapContext:
            type: object
            required: [success, contextVersion, detail, meta, data]
            properties:
                success:
                    type: boolean
                contextVersion:
                    type: string
                    example: tournament-recap-5
                detail:
                    type: string
                    enum: [compact, full]
                meta:
                    type: object
                    properties:
                        ratingVersion:
                            type: string
                            example: "2.0"
                        drawModelVersion:
                            type: string
                            example: draw-1
                        contextHash:
                            type: string
                            description: sha256 (hex) del JSON de `data`
                data:
                    type: object
                    properties:
                        tournament:
                            type: object
                            description: >-
                                Datos del torneo: `competition` (`key` y
                                `label` de la familia, que sale del formato:
                                ej. Superliga), fechas y
                                precisión, `durationDays`, `matchCounts`
                                (regular, playin, playoff, total, validFalse) y
                                `rules` (reglas del formato en texto).
                            additionalProperties: true
                        participants:
                            type: array
                            description: >-
                                Jugadores con `ratingProvisional` (empezaron el
                                torneo con menos de 10 partidos previos; se
                                evalúa antes de su primer partido, NO significa
                                que su rating siga provisorio al final) y sus
                                equipos con `overall` (null si no hay dato) y
                                `group`.
                            items:
                                type: object
                                additionalProperties: true
                        result:
                            type: object
                            description: >-
                                `champion` y `runnerUp` ({ player, team }),
                                `source` ("final" si lo decidió la final,
                                "table" si salió de la tabla) y `final` (el
                                partido que decidió la final: `matchSeq`,
                                `score`, `penalties`, `odds`, `winner`,
                                `upset`, `decidedBy`, `aggregate`), `null` en
                                una liga pura.
                            additionalProperties: true
                        standings:
                            type: object
                            nullable: true
                            description: >-
                                `null` si el formato no tiene fase regular. Si
                                no: `criterion` (la tabla cuenta todos los
                                partidos regulares, también los `valid: false`;
                                no usarla para estadísticas de jugadores),
                                `final` (tabla final por grupo, por
                                equipo, con `qualification` direct, playin,
                                best_third, eliminated o null), `progress`
                                (líder de cada grupo al 25 / 50 / 75 / 100 %; cada
                                `leaders[]` trae `group`, `team`, `player`,
                                `points`, `matchesPlayed` y `matchesLeft`:
                                partidos regulares del grupo jugados y por
                                jugar en ese momento, con el mismo universo que
                                la tabla, `valid: false` incluidos),
                                `leaderChanges` por grupo (luego del primer
                                25 %) y `closeRace`: estado de la tabla
                                cuando faltaban `matchesLeft` partidos (10 en
                                una liga de tabla única), con `group`,
                                `leader`, `leaderTeamId`, `gapToSecond`,
                                `matchesPlayed` y `matchesLeft` (sin
                                porcentaje). `progress`, `leaderChanges` y
                                `closeRace` solo incluyen a los grupos con al
                                menos 30 partidos regulares (una liga o un grupo
                                de `league_playin_playoff`); en los grupos
                                chicos de un mundial, champions o supercopa no
                                hay: `progress` es `[]`, `leaderChanges`
                                `{}` y `closeRace` `[]`.
                            additionalProperties: true
                        playin:
                            type: object
                            nullable: true
                            description: "`{ matchSeqs }`: referencias a `matches` por `seq`"
                            additionalProperties: true
                        playoffs:
                            type: object
                            nullable: true
                            description: >-
                                `rounds` -> `ties`: cada cruce con `teams`
                                (jugador, equipo y seed por nombre), `winner`,
                                `decidedBy` (single_match, aggregate,
                                penalties, golden_goal, walkover,
                                same_player_pick), `aggregate` (ida y vuelta)
                                y `matchSeqs`.
                            additionalProperties: true
                        championPath:
                            type: object
                            description: >-
                                Camino del campeón: posición en la fase
                                regular, play-in si lo jugó y cada cruce
                                (rival, marcador y odds orientados al
                                campeón).
                            additionalProperties: true
                        matches:
                            type: array
                            description: >-
                                Log cronológico. Cada partido: `seq`,
                                `matchId`, `playedAt`, `stage`, `group`,
                                `round`, `playoffId`, `leg`, `p1` y `p2`
                                ({ player, team, teamId, ovr, ratingBefore,
                                provisional }; `provisional` es por partido:
                                el jugador tenía menos de 10 partidos previos
                                en ESE partido, y las probabilidades de un
                                partido con un lado provisorio son poco
                                confiables), `score`, `penalties`, `valid`,
                                `winner` (p1, p2 o draw, por `outcome`),
                                `odds`, `ratingDelta` firmado (null sin
                                evento), `upset`, `importance` (1 a 5) y
                                `notable`.
                            items:
                                type: object
                                additionalProperties: true
                        matchesOmitted:
                            type: integer
                            description: Partidos que `compact` dejó afuera (0 en `full`)
                        ratingMovement:
                            type: object
                            additionalProperties: true
                            description: >-
                                `scope` (texto que aclara qué cifras son del
                                torneo y cuáles globales) y, por jugador:
                                `matches`; del torneo, `delta` (suma de los
                                cambios de Elo de los partidos de este torneo),
                                `bestCumulativeDelta` y
                                `worstCumulativeDelta` (punto más alto y más
                                bajo del delta acumulado, desde 0);
                                `ratingProvisional` (tenía menos de 10 partidos
                                previos ANTES de su primer partido del torneo;
                                no dice que siga provisorio al final); y globales,
                                `globalRatingBeforeFirstMatch`,
                                `globalRatingAfterLastMatch`,
                                `globalPeakRating` y `leaderboard` (`before`
                                y `after` del ranking global e
                                `isNewAllTimePeak`). Más `biggestGainer` y
                                `biggestLoser` (por `delta`) y
                                `overtakes` (adelantamientos en el ranking de
                                Elo con solo los cambios del torneo).
                        playerStats:
                            type: object
                            additionalProperties: true
                            description: >-
                                Por jugador y por etapa: PJ / PG / PE / PP,
                                goles, vallas, efectividad, puntos esperados
                                contra reales, rachas, mejor y peor resultado,
                                equipo más y menos efectivo y penales.
                                `performanceVsExpectedPct` (entero con signo
                                o `null`) es el rendimiento contra lo
                                esperado según el Elo: `+24` son 24 % más
                                puntos de los esperados, `-40` son 40 % menos.
                                `criterion` explica cómo se cuenta.
                        headToHead:
                            type: array
                            description: >-
                                Por pareja que se cruzó: récord en el torneo y
                                `allTimeBefore` (historial por marcador antes
                                del torneo), más `isFinal`.
                            items:
                                type: object
                                additionalProperties: true
                        titleContext:
                            type: object
                            nullable: true
                            additionalProperties: true
                            description: >-
                                Títulos al cierre de este torneo, ESTE
                                INCLUIDO (`countsIncludeThisTournament`;
                                `countsScope` explica los contadores):
                                `ranking` (por jugador `titles`, `runnerUps`,
                                `titlesAndRunnerUps`, `finalsPlayed`,
                                `finalsWon`, `finalsLost` y `rank`; empates
                                comparten posición) y `champion`
                                (`titleNumber`, `rank`, `gapToLeader`,
                                `leadChange`, `isFirstTitle`,
                                `consecutiveTitles` (títulos seguidos en los
                                torneos que jugó, de cualquier formato),
                                `previousTitle` ({ tournamentId, name,
                                competitionLabel, closedAt } del torneo que
                                ganó justo antes, o `null` si
                                `consecutiveTitles` es 1),
                                `wasDefendingChampion` (ganó también la
                                edición anterior del mismo formato) y
                                `defendedEdition` ({ tournamentId, name,
                                closedAt } de esa edición, o `null`; es el
                                último de `competition.previousWinners`),
                                los seis contadores,
                                `beforeThisTournament` con los mismos sin este
                                torneo, `sameCompetition` con los mismos solo
                                para la familia de este torneo y
                                `titlesSameCompetition` con
                                `key`, `label`, `count` y `ordinal`: los
                                títulos del campeón en torneos del mismo
                                formato), `runnerUp` (igual, más
                                `isAlsoChampion`) y `competition` (`key`,
                                `label` y `previousWinners`: campeones de las
                                ediciones anteriores del mismo formato, de más
                                viejo a más nuevo).
                        facts:
                            type: array
                            description: >-
                                Hechos ya detectados, de mayor a menor
                                `importance` (1 a 5), hasta 30. `text` es una
                                oración en español rioplatense de apoyo; los
                                números salen de `data`.
                            items:
                                type: object
                                required:
                                    [id, type, importance, matchIds, data, text]
                                properties:
                                    id:
                                        type: string
                                    type:
                                        type: string
                                    importance:
                                        type: integer
                                        minimum: 1
                                        maximum: 5
                                    matchIds:
                                        type: array
                                        items:
                                            type: string
                                    data:
                                        type: object
                                        additionalProperties: true
                                    text:
                                        type: string
                        dataQuality:
                            type: object
                            description: >-
                                `warnings`, `ratedMatches`, `unratedMatchIds`,
                                `datesApproximate` y `provisionalPlayers`
                                (quienes empezaron el torneo con rating
                                provisorio; solo afecta a sus primeros
                                partidos).
                            additionalProperties: true
        TournamentRecapRequest:
