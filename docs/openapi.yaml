                        $ref: "#/components/schemas/EntityReference"
                teams:
                    type: array
                    minItems: 1
                    items:
                        type: object
                        required: [team, player]
                        properties:
                            team:
                                type: object
                                required: [id, name]
                                additionalProperties: true
                                description: >-
                                    El `id` del equipo se guarda como número;
                                    un string numérico ("10") se convierte.
                                properties:
                                    id:
                                        type: integer
                                        minimum: 0
                                    name:
                                        type: string
                                        minLength: 1
                                        maxLength: 255
                            player:
                                $ref: "#/components/schemas/EntityReference"
                            group:
                                type: string
                                pattern: "^[A-L]$"
                            playoff_id:
                                type: integer
                                minimum: 1
                        additionalProperties: true
        Tournament:
            type: object
            required: [_id, name, format, players, teams]
            properties:
                _id:
                    $ref: "#/components/schemas/MongoId"
                name:
                    type: string
                format:
                    type: string
                    description: |
                        Además de los formatos de `CreateTournamentRequest.format`, los
                        torneos legacy pueden tener `american_cup` o `club_world_cup`
                        (no se pueden crear).
                playoffMode:
                    type: string
                    enum: [single, two_legged]
                    description: Ausente en torneos históricos; sólo aplica a playoff
                schemaVersion:
                    type: integer
                    enum: [1]
                    description: Presente sólo en documentos creados bajo el contrato versionado actual
                players:
                    type: array
                    items:
                        $ref: "#/components/schemas/EntityReference"
                teams:
                    type: array
                    items:
                        type: object
                        additionalProperties: true
                startedAt:
                    type: string
                    format: date-time
                    description: >-
                        Fecha del primer partido jugado del torneo (se fija al
                        cargar el primer resultado y se recalcula si se borra).
                        Ausente = torneo no empezado.
                startedAtPrecision:
                    $ref: "#/components/schemas/PlayedAtPrecision"
                closedAt:
                    type: string
                    format: date-time
                    description: >-
                        Cierre del torneo: fecha del partido que decidió la final
                        o del último partido de la liga. Presente en todo
                        torneo cerrado.
                closedAtPrecision:
                    $ref: "#/components/schemas/PlayedAtPrecision"
            additionalProperties: true
        PlayoffSeriesAggregate:
            type: object
            required: [teamId, score]
            properties:
                teamId:
                    type: integer
                score:
                    type: integer
                    minimum: 0
        PlayoffSeriesMetadata:
            type: object
            required: [key, revision, status, aggregate, winnerTeamId]
            properties:
                key:
                    type: string
                revision:
                    type: integer
                    minimum: 0
                status:
                    type: string
                    enum:
                        [
                            awaiting_leg1,
                            awaiting_leg2,
                            awaiting_tiebreak,
                            decided,
                        ]
                aggregate:
                    type: array
                    items:
                        $ref: "#/components/schemas/PlayoffSeriesAggregate"
                winnerTeamId:
                    type: integer
                    nullable: true
        PlayoffMutationMetadata:
            type: object
            required: [canEditResult, canDeleteResult, reason]
            properties:
                canEditResult:
                    type: boolean
                canDeleteResult:
                    type: boolean
                reason:
                    type: string
                    nullable: true
                    enum:
                        [later_leg_played, series_advanced, configuration_error]
        PlayoffSeriesError:
            type: object
            required: [code, message]
            properties:
                code:
                    type: string
                    enum:
                        [PLAYOFF_CONFIGURATION_ERROR, PLAYOFF_SERIES_NOT_READY]
                message:
                    type: string
        PlayedAt:
            type: string
            format: date-time
            description: >-
                Fecha en la que se jugó el partido. Se fija al cargar el
                primer resultado, no cambia al editarlo y se borra al quitar el
                resultado. Todo partido jugado la tiene; un no jugado no.
        PlayedAtPrecision:
            type: string
            enum: [exact, day, month, year, approx]
            description: >-
                Qué parte de `playedAt` es conocida. Presente siempre que hay
                fecha.
        PlayoffMatch:
            type: object
            properties:
                leg:
                    type: integer
                    enum: [1, 2, 3]
                seriesRevision:
                    type: integer
                    minimum: 0
                playedAt:
                    $ref: "#/components/schemas/PlayedAt"
                playedAtPrecision:
                    $ref: "#/components/schemas/PlayedAtPrecision"
                series:
                    $ref: "#/components/schemas/PlayoffSeriesMetadata"
                mutation:
                    $ref: "#/components/schemas/PlayoffMutationMetadata"
                seriesError:
                    $ref: "#/components/schemas/PlayoffSeriesError"
                prediction:
                    allOf:
                        - $ref: "#/components/schemas/AnyMatchPrediction"
                    nullable: true
                    description: >-
                        Predicción del partido según el APA Rating 2.0. Solo la
                        devuelve `GET .../playoff/matches` (no las respuestas
                        de carga de resultado). En playoffs de partido único
                        es la "Prob. de éxito" (`p1` / `p2`, sin `kind`). En
                        playoffs de `champions_league` y en las patas 1 y 2 de
                        un playoff `two_legged` es la predicción de victoria /
                        empate / derrota (`kind: outcomes`). Es `null` en la
                        pata 3 o sin pata de un playoff `two_legged`, en
                        partidos simulados o W.O. (`valid: false`), con un lado
                        vacío, con el mismo jugador en ambos lados o si el
                        cálculo falla.
            additionalProperties: true
        MatchOutcomesPrediction:
            type: object
            required:
                [
                    kind,
                    p1Win,
                    draw,
                    p2Win,
                    basis,
                    teamAdjusted,
                    provisional,
                    ratingVersion,
                    drawModelVersion,
                ]
            description: >-
                Probabilidad de victoria / empate / derrota de un partido donde
                se puede empatar. Es solo de predicción: no cambia el rating.
                `p1Win + draw + p2Win = 1` y `p1Win + draw / 2` es el puntaje
                esperado del motor. Es por partido: no es la probabilidad de
                avanzar en una serie.
            properties:
                kind:
                    type: string
                    enum: [outcomes]
                p1Win:
                    type: number
                    minimum: 0
                    maximum: 1
                    description: Probabilidad de que gane P1, con 3 decimales.
                draw:
                    type: number
                    minimum: 0
                    maximum: 1
                    description: Probabilidad de empate, con 3 decimales.
                p2Win:
                    type: number
                    minimum: 0
                    maximum: 1
                    description: Probabilidad de que gane P2, con 3 decimales.
                basis:
                    type: string
                    enum: [pre_match, current]
                    description: >-
                        `pre_match`: partido jugado, usa el evento del motor
                        (odds previas al partido). `current`: partido por
                        jugar, usa los ratings actuales y puede moverse.
                teamAdjusted:
                    type: boolean
                    description: >-
                        `false` si no se aplicó el término de equipo y el valor
                        se calculó como en la 1.0.
                provisional:
                    type: boolean
                    description: >-
                        `true` si alguno de los dos jugadores tenía menos de
                        `provisionalMatches` partidos.
                ratingVersion:
                    type: string
                    example: "2.0"
                drawModelVersion:
                    type: string
                    example: draw-1
                    description: Versión del modelo de empate (config/drawModel.js).
        AnyMatchPrediction:
            description: >-
                Predicción de un partido de playoff. Se distingue por la
                presencia de `kind`: si es `outcomes` es
                `MatchOutcomesPrediction`; si no tiene `kind` es
                `MatchPrediction` (probabilidad de avanzar). No se declara un
                discriminador porque la forma de avanzar no trae `kind`.
            oneOf:
                - $ref: "#/components/schemas/MatchPrediction"
                - $ref: "#/components/schemas/MatchOutcomesPrediction"
        FixtureMatch:
            type: object
            additionalProperties: true
            description: Partido del fixture; conserva todos sus campos.
            properties:
                prediction:
                    allOf:
                        - $ref: "#/components/schemas/MatchOutcomesPrediction"
                    nullable: true
                    description: >-
                        Victoria / empate / derrota del partido según el APA
                        Rating 2.0. Es `null` en partidos simulados o W.O.
                        (`valid: false`), con un lado vacío, con el mismo
                        jugador en ambos lados o si el cálculo falla.
        MatchPrediction:
            type: object
            required: [p1, p2, basis, teamAdjusted, provisional, ratingVersion]
            properties:
                p1:
                    type: number
                    minimum: 0
                    maximum: 1
                    description: Probabilidad de avanzar de P1, con 3 decimales.
                p2:
                    type: number
                    minimum: 0
                    maximum: 1
                    description: Probabilidad de avanzar de P2. `p1 + p2 = 1`.
                basis:
                    type: string
                    enum: [pre_match, current]
                    description: >-
                        `pre_match`: partido jugado, usa el evento del motor
                        (odds previas al partido). `current`: partido por
                        jugar, usa los ratings actuales y puede moverse.
                teamAdjusted:
                    type: boolean
                    description: >-
                        `false` si no se aplicó el término de equipo y el valor
                        se calculó como en la 1.0.
                provisional:
                    type: boolean
                    description: >-
                        `true` si alguno de los dos jugadores tenía menos de
                        `provisionalMatches` partidos.
                ratingVersion:
                    type: string
                    example: "2.0"
        PlayinMatch:
            type: object
            properties:
                playedAt:
                    $ref: "#/components/schemas/PlayedAt"
                playedAtPrecision:
                    $ref: "#/components/schemas/PlayedAtPrecision"
                prediction:
                    allOf:
                        - $ref: "#/components/schemas/MatchPrediction"
                    nullable: true
                    description: >-
                        "Prob. de éxito" de cada lado según el APA Rating 2.0.
                        Es `null` en partidos simulados o W.O. (`valid: false`),
                        con un lado vacío, con el mismo jugador en ambos lados,
                        si el torneo es `champions_league` o un playoff
                        `two_legged`, o si el cálculo falla.
            additionalProperties: true
        UpdateMatchRequest:
            type: object
            required: [playerP1, teamP1, scoreP1, playerP2, teamP2, scoreP2]
            additionalProperties: false
            properties:
                playerP1:
                    $ref: "#/components/schemas/EntityReference"
                teamP1:
                    $ref: "#/components/schemas/EntityReference"
                scoreP1:
                    type: integer
                    minimum: 0
                    maximum: 24
                seedP1:
                    oneOf:
                        - type: string
                        - type: integer
                penaltyScoreP1:
                    type: integer
                    minimum: 0
                    maximum: 24
                playerP2:
                    $ref: "#/components/schemas/EntityReference"
                teamP2:
                    $ref: "#/components/schemas/EntityReference"
                scoreP2:
                    type: integer
                    minimum: 0
                    maximum: 24
                seedP2:
                    oneOf:
                        - type: string
                        - type: integer
                penaltyScoreP2:
                    type: integer
                    minimum: 0
                    maximum: 24
                expectedSeriesRevision:
                    type: integer
                    minimum: 0
                    description: Revisión optimista de una serie administrada
                valid:
                    type: boolean
                isThisTheFinal:
                    type: boolean
                    deprecated: true
                    description: >-
                        Ignorado. El backend deriva si el partido es la final a
                        partir del formato del torneo y del `playoff_id`
                        persistido. Se sigue aceptando por compatibilidad y se
                        retirará del contrato.
        ErrorDetail:
            type: object
            required: [source, path, code]
            properties:
                source:
                    type: string
                    enum: [params, query, body]
                path:
                    type: string
                code:
                    type: string
                    description: Tipo de error de Joi o regla de negocio (`match.*`)
                message:
                    type: string
                    description: Explicación en castellano para mostrar al usuario; nunca incluye el valor recibido
        ErrorResponse:
            type: object
            required: [error]
            properties:
                error:
                    type: object
                    required: [code, message, details, requestId]
                    properties:
                        code:
                            type: string
                        message:
                            type: string
                        details:
                            type: array
                            items:
                                $ref: "#/components/schemas/ErrorDetail"
                        requestId:
                            type: string
                            description: Identificador de correlación también presente en X-Request-Id
        Liveness:
            type: object
            required: [status]
            properties:
                status:
                    type: string
                    enum: [ok]
        Readiness:
            type: object
            required: [status, checks]
            properties:
                status:
                    type: string
                    enum: [ready, not_ready]
                checks:
                    type: object
                    required: [mongodb]
                    properties:
                        mongodb:
                            type: string
                            enum:
                                [
                                    disconnected,
                                    connected,
                                    connecting,
                                    disconnecting,
                                    unknown,
                                ]
